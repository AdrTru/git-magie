<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Náhled — Runová dílna</title>
<style>
  :root {
    --bg: #14121a; --panel: #1e1b26; --panel2: #26222f; --line: #38323f;
    --ink: #e8e2d6; --dim: #9a92a6; --gold: #d9b45a; --gold2: #f0cf7a;
    --enemy: #d97a6a; --ally: #6ab0d9; --self: #b98fd9; --ok: #7fce8a;
    --warn: #e0b64a; --bad: #d9605a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1, h2, h3 { font-weight: 600; margin: 0; }
  h1 { font-size: 20px; color: var(--gold2); letter-spacing: .5px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
       color: var(--dim); margin-bottom: 8px; }
  a { color: var(--gold); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
           margin-bottom: 16px; }
  header .sub { color: var(--dim); font-size: 13px; }
  select, input, button, textarea {
    font: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
  }
  button { cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #201a0a; border-color: var(--gold);
                   font-weight: 600; }
  button.primary:hover { background: var(--gold2); }
  /* Rozvržení kreslí `panely.js` z dat ve skriptu — tady zůstává jen vzhled
     panelu. `align-items: start` drží panel u horní hrany svého pásma; bez
     něj by se roztáhl na výšku nejvyššího souseda v řádku. */
  /* VERB-COIN. Karta vybraného kusu se rozbaluje PŘÍMO U NĚJ na výkrese, ne
     v pevném panelu na druhém konci obrazovky — slovesa i cíl mají být na
     jednom místě (přesně to, kvůli čemu vznikl verb-coin místo verbové stěny).
     Kotví se do `.plan-wrap` (má `position: relative`); souřadnice počítá
     `umistiCoin` z bodu objektu na plátně. */
  .mimo { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;
          align-items: center; }
  .mimo:empty { display: none; }
  .mimo-popis { color: var(--dim); font-size: 12px; }
  .mimo-kus { font-size: 12.5px; padding: 4px 9px; border-radius: 7px; }
  .mimo-kus.on { background: var(--gold); color: #201a0a; border-color: var(--gold); }
  .detail { position: absolute; z-index: 6; max-width: 232px; min-width: 150px;
            background: var(--panel2); border: 1px solid var(--gold);
            border-radius: 10px; padding: 8px 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,.55); }
  /* Kus mimo výkres (chystaný bokorys) nemá na mapě bod, u kterého by kolo
     stálo — sedne si do rohu plátna a řekne to. */
  .detail[data-mimo] { left: 8px; top: 8px; }
  .detail-hlava { display: flex; align-items: center; gap: 8px;
                  margin-bottom: 6px; color: var(--gold2); font-size: 13px; }
  .detail-hlava button { margin-left: auto; padding: 2px 8px; }
  /* PANEL ČARODĚJ. Domov hráčovy postavy: stav (výdrž, efekty) a jeho vlastní
     slovesa. Kus, na sebe kterého se v půdorysu neklepe, se dřív musel nabízet
     jako klikací objekt „mimo výkres"; teď má vlastní desku. */
  .kouzli-prep { display: flex; align-items: center; gap: 8px; margin-top: 10px;
                 padding-top: 10px; border-top: 1px solid var(--line);
                 font-size: 13.5px; cursor: pointer; user-select: none; }
  .kouzli-prep input { width: 16px; height: 16px; accent-color: var(--self); }
  .kouzli-prep .zn { color: var(--dim); font-size: 12px; }
  #dilna.kouzli .kouzli-prep { color: var(--gold2); }
  /* PŘEPÍNAČ KOUZLENÍ skryje sesílací aparát, dokud čaroděj nekouzlí. Panely
     se adresují přes `data-panel`, který věší `panely.js`; skrytím zmizí z toku
     na mobilu, na stole nechají po sobě mezeru v mřížce (drobnost, mobil první). */
  #dilna:not(.kouzli) [data-panel="seslani"],
  #dilna:not(.kouzli) [data-panel="vysledek"],
  #dilna:not(.kouzli) [data-panel="runy"],
  #dilna:not(.kouzli) [data-panel="tipy"],
  #dilna:not(.kouzli) [data-panel="svitek"] { display: none; }
  /* Prázdný inventář to řekne. Zmizelý panel vypadá jako vada, ne jako „nic“. */
  .inv-prazdno { color: var(--dim); font-size: 12.5px; font-style: italic; }
  .nahled-pruh { background: #3a2f14; border: 1px solid var(--gold);
                 color: var(--gold2); border-radius: 10px; padding: 10px 12px;
                 margin-bottom: 14px; font-size: 13px; line-height: 1.5; }
  #dilna { gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 16px; }
  /* Odsazení mezi panely dělá `gap` mřížky; ruční margin by se s ním sčítal. */
  /* Proužek s posledním výsledkem není samostatná deska — rám by se mu zdvojil
     s vlastním rámečkem `.lastresult`, a prázdný by svítil naprázdno. */
  .panel[data-panel="vysledek"] { background: none; border: 0; padding: 0; }

  /* scéna */
  .scene-head { display: flex; justify-content: space-between; align-items: baseline;
                gap: 10px; margin-bottom: 12px; }
  .goal { font-size: 13px; color: var(--dim); }
  .goal b { color: var(--ink); font-weight: 500; }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  /* nádrž many místnosti (ukazatel zdroje, § mana) */
  .manapool { min-width: 150px; text-align: right; }
  .manapool .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
                   color: var(--dim); }
  .manapool .num { font-size: 13px; font-weight: 600; color: var(--gold2); margin-left: 5px; }
  .manapool.low .num { color: var(--bad); }
  .manabar { height: 6px; border-radius: 6px; background: var(--panel2);
             border: 1px solid var(--line); margin-top: 4px; overflow: hidden; }
  .manabar > i { display: block; height: 100%; border-radius: 6px;
                 background: linear-gradient(90deg, var(--self), var(--ally)); transition: width .2s; }
  .manapool.low .manabar > i { background: var(--bad); }

  /* živý náhled ceny/šance/validace během psaní kouzla */
  .preview { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
             min-height: 22px; margin-bottom: 8px; font-size: 12.5px; color: var(--dim); }
  .preview.empty { display: none; }
  .preview .pv { display: inline-flex; gap: 5px; align-items: center; }
  .preview .pv b { font-weight: 600; color: var(--ink); }
  .preview .ok   { color: var(--ok); }
  .preview .warn { color: var(--warn); }
  .preview .bad  { color: var(--bad); }
  .plan-wrap { position: relative; margin: 0 0 10px; }
  #plan { width: 100%; height: 240px; display: block; border-radius: 8px;
          background: #0b1a2b; border: 1px solid #1e3a56; cursor: crosshair; }
  .plan-note { font-size: 11px; opacity: .65; margin-top: 4px; }
  .walkbar { display: flex; align-items: center; gap: 8px; margin-top: 6px;
             font-size: 12px; }
  .walkbar .bad { color: #f5a742; }
  .objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px,1fr));
          gap: 10px; }
  .obj { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
         padding: 10px; position: relative; }
  .obj.dead { opacity: .45; filter: grayscale(.6); }
  .obj .ico { font-size: 22px; }
  .obj .nm { font-weight: 600; font-size: 14px; margin: 2px 0 6px; }
  .obj .podtyp { font-size: 11px; margin: -4px 0 6px; color: var(--dim); opacity: .6; }
  .obj .slotline { font-size: 11px; margin: -2px 0 6px; color: var(--dim); }
  .obj .slotline.on { color: var(--ok); font-weight: 600; }
  .obj .bonusline { font-size: 11px; margin: -2px 0 6px; color: var(--gold); }
  .obj .podtyp.znam { color: var(--gold); opacity: 1; }   /* objevený druh (§3.7) */
  .obj.enemy { border-left: 3px solid var(--enemy); }
  .obj.ally  { border-left: 3px solid var(--ally); }
  .obj.self  { border-left: 3px solid var(--self); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; min-height: 4px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 20px;
          background: #322b3a; color: var(--dim); border: 1px solid var(--line); }
  .chip.illus { font-style: italic; opacity: .7; }
  .src { font-size: 11px; color: var(--gold); margin-top: 6px; }
  .hp { height: 4px; background: #3a3340; border-radius: 3px; margin-top: 8px;
        overflow: hidden; }
  .hp > i { display: block; height: 100%; background: var(--ok); }
  .inv-wrap { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .invh { font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
          color: var(--gold); margin-bottom: 8px; }
  .obj .pick { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;
               flex-wrap: wrap; justify-content: flex-end; max-width: 96px; }
  .obj .pick button { padding: 2px 6px; font-size: 12px; border-radius: 6px;
                      line-height: 1; }
  .pick button.on { background: var(--gold); color: #201a0a; border-color: var(--gold); }

  /* seslání */
  .castbar { display: flex; gap: 8px; margin-top: 4px; }
  .castbar input { flex: 1; font-size: 15px; }
  .opts { display: flex; gap: 16px; align-items: center; margin-top: 10px;
          font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .hintline { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .hintline code { background: var(--panel2); padding: 1px 6px; border-radius: 5px;
                   color: var(--gold2); cursor: pointer; }

  /* log */
  #log { max-height: 320px; overflow-y: auto; }
  /* zrcadlo posledního záznamu Kroniky nad řádkem sesílání */
  .lastresult { background: var(--panel); border: 1px solid var(--line);
                border-left: 3px solid var(--gold); border-radius: 12px;
                padding: 2px 16px; margin-bottom: 16px; }
  .lastresult.empty { display: none; }
  .lastresult .entry { border-top: none; }
  .entry { border-top: 1px solid var(--line); padding: 9px 0; }
  .entry:first-child { border-top: none; }
  .entry .cmd { font-family: ui-monospace, monospace; color: var(--gold2); }
  .entry .meta { font-size: 12px; color: var(--dim); margin: 3px 0; }
  .entry .msg { font-size: 13px; margin: 1px 0; }
  .badge { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 20px;
           margin-left: 6px; }
  .b-ok { background: #23402a; color: var(--ok); }
  .b-warn { background: #43391c; color: var(--warn); }
  .b-bad { background: #431f1d; color: var(--bad); }
  .err { color: var(--bad); }

  /* paleta + čtení */
  .pgroup { margin-bottom: 12px; }
  .pgroup h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
               color: var(--dim); margin-bottom: 5px; }
  .runes { display: flex; flex-wrap: wrap; gap: 5px; }
  .rune { font-size: 13px; padding: 2px 9px; border-radius: 7px; cursor: pointer;
          background: var(--panel2); border: 1px solid var(--line); }
  .rune:hover { border-color: var(--gold); color: var(--gold2); }
  .rune small { color: var(--dim); }
  .rune.otisk { border-color: var(--gold); border-style: dashed; color: var(--gold2); }
  .read-out { font-size: 13px; margin-top: 10px; }
  .read-out .zam { font-family: ui-monospace, monospace; font-size: 16px;
                   color: var(--gold2); background: var(--panel2); padding: 8px 10px;
                   border-radius: 8px; }
  .solved { background: #23402a; color: var(--ok); border: 1px solid #3a6b45;
            padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }

  /* tipy kouzel */
  .tgh { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
         color: var(--dim); margin: 14px 0 4px; }
  .tgh:first-child { margin-top: 0; }
  .tip { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
         padding: 6px 0; cursor: pointer; border-top: 1px solid var(--line); }
  .tgroup .tip:first-child { border-top: none; }
  .tip code { background: var(--panel2); padding: 2px 8px; border-radius: 6px;
              color: var(--gold); white-space: nowrap; }
  .tip:hover code { color: var(--gold2); border: 0; outline: 1px solid var(--gold); }
  .tdesc { font-size: 12px; color: var(--dim); flex: 1; }
  .tbadge { font-size: 11px; background: #2b3550; color: #9ec2e6; padding: 0 8px;
            border-radius: 20px; white-space: nowrap; }
  .tbadge.tneed { background: #3a2c1c; color: var(--warn); }
  .tip.tlock { opacity: .68; }

  /* paleta: mastery + zamčené runy */
  .rune small { color: var(--gold); opacity: .8; font-size: 11px; }
  .rune.locked { opacity: .6; border-style: dashed; color: var(--dim); }
  .rune.locked:hover { border-color: var(--gold); color: var(--gold2); opacity: .9; }
  /* „umíš pojmenovat, ale neumíš seslat" (SEEN jméno-látka, #47): zvýrazněná
     i se zámkem — má jméno v knize, ale není naučená; klik ji vloží do řádku. */
  .rune.seen { border-color: var(--gold); border-style: dashed; color: var(--gold2);
               background: #2e2718; }
  .rune.seen:hover { border-color: var(--gold2); background: #372e1c; }
  .rune.seen small { color: var(--gold); opacity: .9; }

  /* rozklad ve čtení */
  .decomp { margin-top: 10px; font-size: 13px; color: var(--dim); }
  .dbtn { padding: 2px 9px; font-size: 13px; border-radius: 6px; margin: 2px 3px 0 0; }
  .dbtn:hover { border-color: var(--gold); color: var(--gold2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚝ Runová dílna</h1>
    <span class="sub">prototyp jazyka kouzel — napiš kouzlo a dívej se, co to udělá</span>
    <span style="flex:1"></span>
    <label class="sub">Scéna:
      <select id="scenePick"></select>
    </label>
    <label class="sub" title="Zapnuto: naučené runy, otisky, objevené látky a pojmenovaná kouzla se při přepnutí místnosti ZACHOVAJÍ (bez přepsání). Vypnuto: každá scéna má čerstvý profil.">
      <input type="checkbox" id="prenes"> Přenášet mezi místnostmi
    </label>
    <label class="sub" title="LADĚNÍ: vykreslí i to, na co čaroděj nevidí (hlídky za rohem apod.). Skrytým se neposílá zorný klín, takže se ukáže značka a natočení, ne kužel. V normální hře nechat vypnuté.">
      <input type="checkbox" id="ladeniVse"> 🐛 Zobrazit vše
    </label>
    <button id="saveBtn" title="Uloží rozehranou partii — scénu i s průběhem, znalosti a knihu kouzel.">Uložit</button>
    <button id="loadBtn" title="Vrátí se k uložené partii.">Načíst</button>
    <button id="resetBtn">Restart scény</button>
  </header>

  <div class="nahled-pruh">
    <b>Náhled rozvržení.</b> Místnosti přepínat můžeš (jsou zapečené), ale
    seslání, chůze ani ukládání tu nefungují — potřebují Python, a ten tady
    není. Zkoušej rozmístění panelů: zmenši okno nebo otoč telefon.
  </div>
  <div id="dilna"></div>
</div>

<!-- OBSAH PANELŮ.
     Rozmístění dělá `panely.js` z dat níž ve skriptu; sem patří jen
     to, CO v panelu je. Šablona se do panelu přesune jednou, při jeho
     vzniku — přeskládání rozvržení ji nechává být, takže rozepsaný
     řádek ani obsah canvasu otočením telefonu nezmizí. -->
<template id="sablona-pudorys">
  <div class="scene-head">
    <div>
      <h2 id="sceneName">Scéna</h2>
      <div class="goal" id="goal"></div>
    </div>
    <div class="head-right">
      <div class="manapool" id="manapool"></div>
      <!-- Krok času je DOBRODRUŽNÁ akce (pohyb hlídek, šíření ohně), ne kouzlení
           — musí zůstat vidět i když je sesílací aparát složený. Sedí u mapy,
           kterou mění. -->
      <button id="tickBtn" title="krok času: pohyb hlídek, šíření ohně, průběžné působení (#39)">Krok času ⏱</button>
      <!-- PŘEHRÁVAČ ZAPEČENÉ OBCHŮZKY. Objeví se, jen když jsou takty po ruce
           (`TAKTY_CHUZE`, peče `generuj_pudorys.py`) A svítí ladicí režim.
           Ve hře s Pythonem se neukáže schválně: tam hlídkami hýbe engine přes
           Krok času a přehrát vedle toho konzervu by byla DRUHÁ PRAVDA o tom,
           kde kdo stojí. Zapečené takty platí pro rozestavení ze souboru. -->
      <button id="casBtn" style="display:none" title="LADĚNÍ: přehraje zapečenou obchůzku (§9) — kde hlídky chodí a kam koukají.">▶ čas</button>
      <span class="solved" id="solved" style="display:none">✔ Scéna vyřešena</span>
    </div>
  </div>
  <div class="plan-wrap">
    <canvas id="plan" width="640" height="300"></canvas>
    <div class="plan-note" id="planNote"></div>
    <div class="walkbar" id="walkBar" style="display:none">
      <button class="primary" id="walkBtn">👣 Jdi sem</button>
      <button id="aimBtn" title="natočit se k tomuto místu (Směr)">🧭 Zamiř sem</button>
      <span id="walkInfo"></span>
      <button id="walkCancel" title="zrušit označené místo">✕</button>
    </div>

    <!-- VERB-COIN: karta vybraného kusu se otevře PŘÍMO U NĚJ na výkrese —
         odpověď na klepnutí je tam, kam se kleplo, ne na druhém konci obrazovky.
         Zavřená nezabírá místo. Kotví se do `.plan-wrap`, souřadnice staví
         `umistiCoin` z bodu objektu (kus mimo výkres nemá bod → roh, [data-mimo]). -->
    <div class="detail" id="detail" style="display:none">
      <div class="detail-hlava">
        <b id="detailNazev"></b>
        <button id="detailZavri" title="zavřít">✕</button>
      </div>
      <div class="objs" id="detailKarta"></div>
    </div>
  </div>
  <!-- KUSY, KTERÉ TENHLE POHLED NENABÍZÍ. Půdorys je JEDEN pohled, ne seznam
       všeho: chystaný bokorys ukáže popředí, které v půdorysu není vidět, a
       naopak. Výběr proto nesmí viset na jednom pohledu — co žádný nenabízí,
       musí jít vybrat odsud. Čaroděj sem NEPATŘÍ: na sebe se v půdorysu neklepe,
       ale nemá být klikací objekt — má vlastní panel (viz „sablona-carodej").
       Prázdné se to nekreslí, takže to nepřekáží, dokud není co nabídnout. -->
  <div class="mimo" id="mimoVykres"></div>
</template>

<!-- PANEL ČARODĚJ. Hráčova postava: její stav a její VLASTNÍ slovesa (na sebe).
     `#carodejStav` plní `vykresliCarodej` toutéž kartou jako u kusů ve scéně —
     včetně 🔍 prozkoumej a 👉 zaměř na sebe. Přepínač kouzlení překlápí dílnu
     mezi dobrodružnou plochou a sesíláním (skrývání panelů řeší CSS). -->
<template id="sablona-carodej">
  <div id="carodejStav"></div>
  <label class="kouzli-prep" title="Zapnuto: ukáže runy a řádek seslání. Vypnuto: jen dobrodružné ovládání (chůze, manipulace).">
    <input type="checkbox" id="kouzliToggle">
    <span>✨ Kouzlení</span>
    <span class="zn" id="kouzliZnacka">— vypnuto</span>
  </label>
</template>

<template id="sablona-inventar">
  <div class="inv-wrap" id="invWrap" style="display:none">
    <div class="objs" id="inv"></div>
  </div>

  <div class="inv-prazdno" id="invPrazdno">Zatím nic neneseš.</div>
</template>

<template id="sablona-seslani">
  <div class="preview empty" id="preview"></div>
  <div class="castbar">
    <input id="spell" placeholder="např. Zažehni Oheň Nepřítel Projektil"
           autocomplete="off">
    <button id="clearBtn" title="smazat řádek (Esc)">✕</button>
    <button class="primary" id="castBtn">Sešli</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="force"> na sílu (protlačit nejednoznačné)</label>
    <span id="selInfo"></span>
  </div>
  <div class="hintline">

let koridory = [];

function objIco(o){

function chipsHTML(o){

  }).join("");
}
// Pasivní modifikátory výbavy → čitelný text („−20% mana · +5% šance").
function bonusText(b){
  if(!b) return "";
  const p = [];
  if(b.mana!=null && b.mana!==1) p.push(`${b.mana<1?'−':'+'}${Math.round(Math.abs(1-b.mana)*100)}% mana`);
  if(b.sance!=null && b.sance!==0) p.push(`${b.sance>0?'+':'−'}${Math.round(Math.abs(b.sance)*100)}% šance`);
  return p.join(" · ");
}
// Karta objektu — sdílená pro scénu i inventář; tlačítka podle režimu (§8.4).
function objCard(o, mode){
  const src = o.zdroj_zivel
    ? `<div class="src">⛲ zdroj ${o.zdroj_zivel} · ${Math.round(o.kvalita*100)}%${o.zdroj_many?" · kotva many":""}</div>`

  const hp = (o.vydrz!==null)
    ? `<div class="hp"><i style="width:${Math.max(0,Math.min(100,o.vydrz*4))}%"></i></div>` : "";
  let btns = `<button class="prozkoumej" data-id="${o.id}" title="prozkoumej (popis + odhalí obsah, §8.4)">🔍</button>`;
  // ⛏ čerpání a 👉 cílení jdou i na nesené věci (§8.2): nasazený prsten-kotva se
  // dá označit jako kanál/cíl, z neseného zdroje čerpat (bod 2 novinek).

  btns += `<button class="ukaz ${ukazIds.has(o.id)?'on':''}" data-id="${o.id}" title="označit cíl / kanál (klikni víc — zásah všech, mana ×počet)">👉</button>`;

  if(mode!=="inv" && !o.tagy.includes("já")) btns += `<button class="jdi" data-id="${o.id}" title="jdi k tomu (chůze stojí čas, §39)">👣</button>`;
  if(mode==="inv"){
    if(o.slot) btns += `<button class="vybav ${o.vybaveno?'on':''}" data-id="${o.id}" data-on="${o.vybaveno?1:0}" title="${o.vybaveno?'sundej':'nasaď'} (slot ${o.slot})">${o.vybaveno?'✅':'⬜'}</button>`;
    btns += `<button class="poloz" data-id="${o.id}" title="polož do scény (§8.4)">🖐</button>`;
  } else {
    if(o.otviratelny){
      const open = (o.stavy||[]).includes("otevřeno");
      const lbl = o.zamceno ? "🔒" : (open ? "📂" : "📦");
      const ttl = o.zamceno ? "zamčeno — odemkni klíčem (použij klíč na …), rozvaž kouzlem (ne Sváž), nebo rozbij"
                            : (open ? "zavři (§8.4)" : "otevři (§8.4)");
      btns += `<button class="otevri" data-id="${o.id}" data-open="${open?1:0}" title="${ttl}">${lbl}</button>`;
    }
    if(o.prenosny && !o.znicene) btns += `<button class="seber" data-id="${o.id}" title="seber do inventáře (§8.4)">🫳</button>`;
  }
  return `<div class="obj ${objClass(o)} ${o.znicene?'dead':''}">
    <div class="pick">${btns}</div>
    <div class="ico">${objIco(o)}</div>
    <div class="nm">${o.nazev}</div>
    ${o.podtyp?`<div class="podtyp ${o.podtyp_znamy?'znam':''}" title="${o.podtyp_znamy?'objevený druh — zvedá šanci (§3.7)':'druh cíle — zatím neobjevený'}">🎯 ${o.podtyp}${o.podtyp_znamy?'':' ?'}</div>`:""}
    ${(mode==="inv"&&o.slot)?`<div class="slotline ${o.vybaveno?'on':''}">${o.vybaveno?"🎽 nasazeno":"🎒 slot "+o.slot}</div>`:""}
    ${(mode==="inv"&&o.slot&&bonusText(o.bonusy))?`<div class="bonusline">✨ ${bonusText(o.bonusy)}</div>`:""}

    ${src}${hp}
  </div>`;
}

// Který kus je rozbalený pod výkresem. Null = zavřeno.
let vybranyId = null;
let coinPos = null;   // bod objektu na plátně, u nějž coin stojí (null = kus mimo výkres)
/* LADICÍ REŽIM „zobrazit vše": kresli a nech vybrat i to, na co čaroděj NEVIDÍ
   (hlídky za rohem apod.). Jen pro autora — normální hra ukazuje jen viditelné,
   jinak by prozradila rozvržení, jehož smysl je „jsi slepý, sežeň světlo".
   Geometrie zůstává v Pythonu: skrytým se neposílá zorný klín, takže se ukáže
   značka a natočení, ne kužel. */
let ladeniVse = false;

/* Detail vybraného kusu. Táž karta jako v inventáři — kdyby měl výběr vlastní
   podobu, rozešly by se: nové tlačítko by přibylo na jednom místě a na druhém
   ne. Karta zná jen `mode`, nic víc. */
function vykresliDetail(objekty){
  const o = objekty.find(x=>x.id===vybranyId);
  /* Vybraný kus mohl zmizet (shořel, sebral se) nebo se ztratit z dohledu.
     Zavřít je jediná poctivá odpověď — karta z minulého taktu by tvrdila, že
     tam pořád je. */
  if(!o || (!o.vidis && !ladeniVse)) vybranyId = null;
  $("#detail").style.display = vybranyId ? "" : "none";
  if(!vybranyId) { $("#detailKarta").innerHTML = ""; return; }
  $("#detailNazev").textContent = o.nazev;
  $("#detailKarta").innerHTML = objCard(o, "scene");
  umistiCoin(coinPos);   // postav kartu k objektu (verb-coin), ne pod výkres
}

/* Postaví coin k bodu objektu na plátně. Bez bodu (kus mimo výkres) si sedne
   do rohu — `data-mimo` to řekne stylem. Kartu změří až po zobrazení, aby
   nepřetekla plátno: radši vedle bodu, a když se nevejde, na druhou stranu. */
function umistiCoin(pos){
  const box = $("#detail"), wrap = box.parentElement;   // .plan-wrap
  if(!pos){ box.dataset.mimo = "1"; box.style.left = ""; box.style.top = ""; return; }
  delete box.dataset.mimo;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let x = pos.x + 14;                        // vedle bodu, ne přes něj
  if(x + bw > w - 4) x = pos.x - bw - 14;    // nevejde se vpravo → doleva
  x = Math.max(4, Math.min(x, w - bw - 4));
  const y = Math.max(4, Math.min(pos.y - bh / 2, h - bh - 4));
  box.style.left = x + "px"; box.style.top = y + "px";
}

/* Panel Čaroděj: hráčova postava. Táž karta jako u kusů ve scéně — stav (výdrž,
   efekty) a jeho VLASTNÍ slovesa (🔍 prozkoumej, 👉 zaměř na sebe). Kdyby měl
   vlastní podobu, rozešla by se s kartami kusů. Tlačítka zaváže `bindObjButtons`
   z `render` (běží po tomhle). */
function vykresliCarodej(objekty){
  const box = $("#carodejStav");
  if(!box) return;
  const ja = objekty.find(o => o.tagy.includes("já"));
  box.innerHTML = ja
    ? objCard(ja, "scene")
    : `<div class="inv-prazdno">Čaroděj v téhle scéně není.</div>`;
}

/* Na které kusy se v půdorysu klepnout DÁ. Čaroděj ne (na sebe se v mapě
   neklepe — má vlastní panel) a nic bez obrysu; s bokorysem přibude popředí,
   které půdorys nevidí. Kritérium je TOTOTÉŽ, jaké používá hledání nejbližšího
   kusu při klepnutí — jedno místo, dvě čtení by se rozešla. */
function nabidneVykres(o){
  return !!o.obrys && !o.tagy.includes("já");
}

function vykresliMimoVykres(objekty){
  // Čaroděj sem NEPATŘÍ, i když ho výkres taky „nenabízí" — má vlastní panel,
  // ne řádek klikacích kusů. Zbývá tedy popředí bez obrysu (chystaný bokorys).
  const mimo = objekty.filter(o => (o.vidis || ladeniVse) && !nabidneVykres(o) && !o.tagy.includes("já"));
  $("#mimoVykres").innerHTML = mimo.length
    ? `<span class="mimo-popis">Výkres nenabízí:</span> ` + mimo.map(o =>
        `<button class="mimo-kus ${o.id===vybranyId?'on':''}" data-id="${o.id}"
                 title="rozbalit kartu">${objIco(o)} ${o.nazev}</button>`).join("")
    : "";
}

/* `pos` = bod objektu na plátně {x,y}, u nějž má coin stát. Klepnutí do výkresu
   ho dodá; kus mimo výkres (řádek pod výkresem) ho nemá → coin do rohu. */
function vyberKus(id, pos){
  vybranyId = (vybranyId === id) ? null : id;   // druhé klepnutí zavírá
  coinPos = vybranyId ? (pos || null) : null;
  /* Výběr je VĚC OBRAZOVKY, ne tah ve scéně — nesmí sáhnout na server.
     `refresh()` by kvůli rozbalení karty stáhl celý stav a překreslil scénu;
     kusy jsou přitom v `planStav`, ze kterého kreslí i výkres. */
  const vsechny = planStav ? planStav.objekty : [];
  vykresliDetail(vsechny);
  vykresliMimoVykres(vsechny);
  bindObjButtons();      // karta je nová, obsluha tlačítek na ní ještě nevisí
  kresliPlan();          // ať je vybraný kus na výkrese vidět
}

function render(state){
  const s = state.scena;
  // Pročisti výběr: vyčerpaný/zmizelý zdroj nesmí zůstat označený k čerpání
  // (jinak by ho další seslání poslalo a spadlo na „není z čeho čerpat").
  // Bere scénu I nesený inventář (§8.2) — z neseného zdroje/kotvy jde taky čerpat/cílit.
  const vse = s.objekty.concat(s.inventar || []);
  const zdroje = new Set(vse.filter(o=>o.zdroj_zivel).map(o=>o.id));
  cerpej = new Set([...cerpej].filter(id=>zdroje.has(id)));
  // Odznač cíle, které zmizely NEBO padly (zničené) — ať neplýtváš manou na
  // mrtvý cíl (troska zůstává ve scéně, ale z ručního výběru vypadne).
  const ziveCile = new Set(vse.filter(o=>!o.znicene).map(o=>o.id));
  ukazIds = new Set([...ukazIds].filter(id=>ziveCile.has(id)));
  ukazUlozeni(state.ulozeni);
  planStav = {objekty: s.objekty, klic: s.klic};   // půdorys kreslí TÝŽ stav, co seznam kusů
  /* Překreslení = nový stav, takže případná přehrávka obchůzky končí: takt
     patřil TOMU rozestavení, ve kterém se zapekl. Tlačítko se přehodnotí,
     protože jiná scéna nemusí mít chodce. */
  if(typeof zastavCas === "function"){ casTakt = 0; zastavCas(); ukazCasTlacitko(); }
  // Cíl chůze platí jen pro TEN stav, ve kterém se spočítal: mezi kroky se
  // hlídka pohne, dveře zavřou, oheň chytí — a trasa už neplatí.
  chuze = null; ukazChuzi();
  koridory = [];       // scéna je jiná — pás dokreslí až čerstvý náhled
  kresliPlan();
  $("#sceneName").textContent = s.nazev;
  $("#goal").innerHTML = s.cil.length
    ? "Cíl: " + s.cil.map(t=>`<b>${t}</b>`).join(" &amp; ")
    : "Volná aréna — bez cíle, jen si hraj.";
  $("#solved").style.display = s.vyresena ? "" : "none";

  // nádrž many místnosti (§ mana). mana_max<=0 = neomezená → ukazatel skryjeme.
  const mp = $("#manapool");
  if(s.mana_max > 0){
    const pct = Math.max(0, Math.min(100, 100 * s.mana / s.mana_max));
    const low = s.mana <= s.mana_max * 0.25;
    mp.className = "manapool" + (low ? " low" : "");
    mp.innerHTML =
      `<span class="lbl">Mana místnosti</span>` +
      `<span class="num">${s.mana} / ${s.mana_max}</span>` +
      `<div class="manabar"><i style="width:${pct}%"></i></div>`;
  } else {
    mp.className = "manapool"; mp.innerHTML = "";
  }

  // scény do selectu
  const pick = $("#scenePick");
  if(pick.children.length !== state.sceny.length){
    pick.innerHTML = state.sceny.map(x=>`<option value="${x.klic}">${x.nazev}</option>`).join("");
  }
  pick.value = s.klic;

  // Kusy ve scéně se NEVYPISUJÍ. Kde co je, ukazuje půdorys; karta se rozbalí
  // u kusu až po klepnutí (viz `vykresliDetail`). Seznam vedle výkresu říkal
  // totéž dvakrát a na telefonu zabral celou obrazovku.
  vykresliCarodej(s.objekty);   // hráčova postava má vlastní panel, ne kus na mapě
  vykresliDetail(s.objekty);
  vykresliMimoVykres(s.objekty);

  // Inventář zůstává seznamem: co neseš, nikde na výkrese neleží, takže není
  // kam klepnout. Prázdný to řekne — mizející panel vypadá jako vada.
  const inv = s.inventar || [];
  $("#invWrap").style.display = inv.length ? "" : "none";
  $("#invPrazdno").style.display = inv.length ? "none" : "";
  $("#inv").innerHTML = inv.map(o=>objCard(o,"inv")).join("");

  // paleta: naučené runy s mastery %, neznámé zamčené (klik = do svitku)
  $("#paleta").innerHTML = state.paleta.map(g=>`
    <div class="pgroup"><h3>${g.nadpis}</h3><div class="runes">
      ${g.runy.map(r=> r.znama
        ? `<span class="rune" data-t="${r.nazev}" title="${r.vyznam||''}">${r.nazev}${r.mastery!=null?` <small>${Math.round(r.mastery*100)}%</small>`:''}</span>`
        : r.videna
          ? `<span class="rune seen" data-t="${r.nazev}" title="Umíš pojmenovat, ale zatím neumíš seslat${r.vyznam?` — ${r.vyznam}`:''}. Klik ji vloží do řádku; sešli (čerpej ⛏ zdroj) a naučíš se ji.">🔒 ${r.nazev} <small>✎ pojmenuješ</small></span>`
          : `<span class="rune locked" data-t="${r.nazev}" title="neznámá runa — objev ji čtením svitku (§7) nebo čerpáním u zřídla (§8.1)">🔒 ${r.nazev}</span>`
      ).join("")}
    </div></div>`).join("");

  // Poznané podtypy cílů (§3.7): expertíza na druh, zvedá šanci
  const pt = state.podtypy || [];
  $("#podtypy").innerHTML = pt.length
    ? `<div class="pgroup"><h3>Poznané druhy cílů 🎯</h3><div class="runes">${
        pt.map(p=>`<span class="rune" title="expertíza na druh — naučený podtyp zvedá šanci (§3.7)">${p.nazev} <small>${Math.round(p.mastery*100)}%</small></span>`).join("")
      }</div></div>`
    : "";

  // Otisky magie v holi (§4.1): surgem zahlédnutá runa; klik = pochopit (naučit)
  const ot = state.otisky || [];
  $("#otisky").innerHTML = ot.length
    ? `<div class="pgroup"><h3>Otisky v holi 🪄</h3><div class="runes">${
        ot.map(o=>`<span class="rune otisk" data-id="${o.id}" title="klik = pochopit otisk a naučit se runu (§4.1)">✨ ${o.nazev}</span>`).join("")
      }</div></div>`
    : "";

  knownNames = new Set();
  state.paleta.forEach(g=>g.runy.forEach(r=>{ if(r.znama) knownNames.add(r.nazev.toLowerCase()); }));

  renderTips(s.klic);
  bindObjButtons();
  updateSel();
  schedulePreview();   // stav se změnil (nádrž, čerpání, cíle) → osvěž náhled
}

function updateSel(){
  const parts = [];
  if(cerpej.size) parts.push("⛏ čerpám: " + [...cerpej].join(", "));
  if(ukazIds.size) parts.push("👉 cíle (" + ukazIds.size + "): " + [...ukazIds].join(", "));
  $("#selInfo").textContent = parts.join("   ");
}

function bindObjButtons(){
  document.querySelectorAll(".mimo-kus").forEach(b=>b.onclick=()=>vyberKus(b.dataset.id));
  document.querySelectorAll(".cerp").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; cerpej.has(id)?cerpej.delete(id):cerpej.add(id);
    b.classList.toggle("on"); updateSel(); schedulePreview();  // čerpání mění cenu
  });
  document.querySelectorAll(".ukaz").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; ukazIds.has(id)?ukazIds.delete(id):ukazIds.add(id);
    b.classList.toggle("on"); updateSel(); schedulePreview();  // cíle mění faktor many
  });
  document.querySelectorAll(".otisk").forEach(b=>b.onclick=async()=>{
    const r = await api("/api/comprehend", {runa_id: b.dataset.id});
    if(r && r.chyba){ alert(r.chyba); return; }
    await refresh();   // otisk zmizí, runa přibude do palety
  });
  // Manipulace (§8.4): tlačítka na kartách odkazují objekt id → doAction.
  document.querySelectorAll(".prozkoumej").forEach(b=>b.onclick=()=>doAction("prozkoumej "+b.dataset.id));
  document.querySelectorAll(".jdi").forEach(b=>b.onclick=()=>doAction("jdi k "+b.dataset.id));
  document.querySelectorAll(".seber").forEach(b=>b.onclick=()=>doAction("seber "+b.dataset.id));
  document.querySelectorAll(".poloz").forEach(b=>b.onclick=()=>doAction("polož "+b.dataset.id));
  document.querySelectorAll(".otevri").forEach(b=>b.onclick=()=>doAction((b.dataset.open==="1"?"zavři ":"otevři ")+b.dataset.id));
  document.querySelectorAll(".vybav").forEach(b=>b.onclick=()=>doAction((b.dataset.on==="1"?"sundej ":"nasaď ")+b.dataset.id));
}

// Delegovaně (přežije překreslení palety): klik na runu ji vloží do řádku,
// klik na příklad v nápovědě nahradí řádek.
document.addEventListener("click", e=>{
  const inp = $("#spell");
  const locked = e.target.closest(".rune.locked");   // neznámá runa → do svitku k objevení
  if(locked){ const sc=$("#scroll"); sc.value=locked.dataset.t; sc.focus(); return; }
  const rune = e.target.closest(".rune");            // známá runa → přidá slovo
  if(rune && rune.dataset.t){ inp.value=(inp.value+" "+rune.dataset.t).trim(); inp.focus(); schedulePreview(); return; }
  const tip = e.target.closest(".tip");
  if(tip){
    if(tip.dataset.locked==="1"){ const sc=$("#scroll"); sc.value=tip.dataset.t; sc.focus(); }
    else { inp.value=tip.dataset.t; inp.focus(); schedulePreview(); }   // dostupný tip → nahradí řádek
    return;
  }
  const ex = e.target.closest(".hintline code");
  if(ex){ inp.value=ex.textContent; inp.focus(); schedulePreview(); }
});

// Rozklad: tlačítko ◇ ve čtení vytáhne střípek runy a naučí ji (§7).
document.addEventListener("click", async e=>{
  const d = e.target.closest(".dbtn");
  if(!d) return;
  const text = $("#scroll").value.trim();
  const res = await api("/api/decompose", {text, runa_id:d.dataset.id});
  if(res.ok){ $("#readBtn").click(); await refresh(); }
  else { $("#readOut").innerHTML = `<span class="err">✖ ${res.chyba}</span>`; }
});


/* ── PŮDORYS VE HŘE ──────────────────────────────────────────────────────────
   Prostorová vrstva byla dosud pro hráče neviditelná: `prozkoumej` hlásil
   číslo a zbytek si měl domyslet. Tady se kreslí, co scéna doopravdy je.

   ŽÁDNÁ GEOMETRIE V PROHLÍŽEČI. Obrys, vzdálenost i „vidíš na to" počítá
   `prostor.py` a server je posílá hotové (`misto_json`). Kdyby si to výkres
   dopočítával sám, měl by projekt druhou kopii pravdy — přesně to, co se tu
   jednou stalo mezi náhledem a sesláním. Zdejší kód umí jen škálovat a kreslit.

   Editor `ui/pudorys.html` je jiný případ: je to samostatný soubor bez serveru,
   svou kopii geometrie má a hlídá ji `test_pudorys.py` proti Pythonu.         */
let planStav = null;
const plan = $("#plan"), pctx = plan.getContext("2d");

function bodyObrysu(o){                     // všechny body obrysu, ať už je jakýkoli
  if(!o.obrys) return [];
  if(o.obrys[0] === "kruh"){
    const [[x,y], r] = o.obrys[1];
    return [[x-r,y-r],[x+r,y+r]];
  }
  return o.obrys[1].flat();
}

function kresliPlan(){
  const st = planStav;
  const dpr = window.devicePixelRatio || 1;
  const sir = plan.clientWidth || 640, vys = plan.clientHeight || 240;
  if(plan.width !== Math.round(sir*dpr) || plan.height !== Math.round(vys*dpr)){
    plan.width = Math.round(sir*dpr); plan.height = Math.round(vys*dpr);
  }
  pctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.clearRect(0,0,sir,vys);
  pctx.fillStyle = "#0b1a2b"; pctx.fillRect(0,0,sir,vys);
  if(!st) return;

  // Kreslí se JEN, na co vidíš. Tma a clona z výkresu kus vyškrtnou — jinak by
  // půdorys prozradil rozvržení cely, jejíž celý smysl je „jsi slepý, sežeň
  // světlo". Natočení hlavy naopak nekreslí nic: otočit se je zadarmo, tak by
  // místnost jen blikala (server proto počítá `vidis` bez výseče).
  const vsechny = st.objekty.filter(o=>o.obrys);
  const umistene = vsechny.filter(o=>o.vidis || ladeniVse);
  const skryto = vsechny.length - umistene.length;
  const note = $("#planNote");
  if(!umistene.length){
    pctx.fillStyle = "rgba(159,211,232,.5)";
    pctx.font = "12px ui-monospace,monospace"; pctx.textAlign = "center";
    pctx.fillText(vsechny.length ? "Odsud nevidíš na nic — posviť si."
                                 : "Tahle scéna nemá souřadnice — půdorys se nekreslí.",
                  sir/2, vys/2);
    note.textContent = "";
    return;
  }

  // Měřítko podle toho, co ve scéně je; okraj na popisky.
  const vse = umistene.flatMap(bodyObrysu);
  const xs = vse.map(b=>b[0]), ys = vse.map(b=>b[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const okraj = 26;
  const m = Math.min((sir-2*okraj) / Math.max(0.5, x1-x0),
                     (vys-2*okraj) / Math.max(0.5, y1-y0));
  const sx = x => okraj + (x - x0) * m;
  const sy = y => vys - okraj - (y - y0) * m;   // sever nahoru, jako v editoru
  planStav.prevod = {sx, sy, m, x0, y0, vys, okraj};

  const ja = umistene.find(o=>o.tagy.includes("já"));
  kresliKliny(umistene, sx, sy);      // pod objekty, ať nepřebarvují scénu
  for(const o of umistene){
    const jaSam = o === ja;
    const oznaceny = ukazIds.has(o.id), cerpany = cerpej.has(o.id);
    pctx.save();
    pctx.lineWidth = oznaceny || cerpany ? 3 : (o.cloni || o.neprojdes ? 2.5 : 1.5);
    // Barva NESE VÝZNAM, ne dekoraci: co cloní, co jde projít, co je vybrané.
    pctx.strokeStyle = jaSam ? "#7ee0a8"
      : oznaceny ? "#f5a742"
      : cerpany ? "#8fd3ff"
      : o.znicene ? "rgba(159,211,232,.3)"
      : o.cloni && !o.neprojdes ? "#c9a5f0"
      : "#9fd3e8";

    if(o.obrys[0] === "kruh"){
      const [[x,y], r] = o.obrys[1];
      pctx.beginPath(); pctx.arc(sx(x), sy(y), Math.max(3, r*m), 0, 7); pctx.stroke();
    } else {
      const puntik = o.obrys[1].length === 1 &&
                     o.obrys[1][0][0][0] === o.obrys[1][0][1][0] &&
                     o.obrys[1][0][0][1] === o.obrys[1][0][1][1];
      if(puntik){
        pctx.beginPath(); pctx.arc(sx(o.pozice[0]), sy(o.pozice[1]), oznaceny?6:4, 0, 7);
        pctx.fillStyle = pctx.strokeStyle; pctx.fill();
      } else {
        pctx.beginPath();
        for(const [a,b] of o.obrys[1]){ pctx.moveTo(sx(a[0]), sy(a[1])); pctx.lineTo(sx(b[0]), sy(b[1])); }
        pctx.stroke();
      }
    }
    pctx.restore();
  }

  if(ja) kresliSmerHrace(ja, sx, sy, m);
  if(koridory.length) kresliKoridory(sx, sy, m);
  if(chuze) kresliChuzi(ja, sx, sy);

  // Popisky až nakonec, ať je nepřekryjí čáry.
  pctx.font = "10px ui-monospace,monospace"; pctx.textAlign = "center";
  for(const o of umistene){
    pctx.fillStyle = ukazIds.has(o.id) ? "#f5a742" : "rgba(210,232,244,.75)";
    const popis = o.vzdalenost == null ? o.nazev : `${o.nazev} · ${o.vzdalenost}`;
    pctx.fillText(popis, sx(o.pozice[0]), sy(o.pozice[1]) - 8);
  }
  note.textContent = "Klik na kus = cíl kouzla 👉, klik do volna = místo "
    + "(👣 jít · 🧭 zamířit). Oranžová plocha je to, kam hlídka dohlédne. "
    + "Čísla jsou kroky od tebe."
    + (skryto ? `  Na ${skryto} ${skryto===1?"kus":(skryto<5?"kusy":"kusů")} odsud nevidíš — posviť si.` : "");
}

/* Kam se hlídky dívají (§5.2). Podklad, ne rada: hra neříká „tudy nechoď",
   ukáže zorná pole a načasovat si průchod — počkat, otočit stráž kouzlem,
   proklouznout mezi obchůzkami — zůstane na hráči. Klín počítá jádro
   (`zorny_klin`) toutéž funkcí, kterou pak vydá „spatřeno", takže je ořezaný
   o zdi a zavře se, když stráž oslepne. Kreslí se pod objekty, ať nepřekrývá
   to, co je ve scéně doopravdy. */
function kresliKliny(umistene, sx, sy){
  pctx.save();
  for(const o of umistene){
    if(!o.klin || !o.pozice) continue;
    pctx.beginPath();
    pctx.moveTo(sx(o.pozice[0]), sy(o.pozice[1]));
    for(const b of o.klin) pctx.lineTo(sx(b[0]), sy(b[1]));
    pctx.closePath();
    pctx.fillStyle = "rgba(245,167,66,.13)";
    pctx.fill();
    pctx.strokeStyle = "rgba(245,167,66,.35)"; pctx.lineWidth = 1;
    pctx.stroke();
  }
  pctx.restore();
}

/* Kudy poletí mířený zásah a koho vezme (#60). Pás i seznam zasažených počítá
   jádro (`Nahled.koridory`) TÝMIŽ funkcemi, jakými se pak zásah rozhoduje —
   výkres jen škáluje kroky na pixely, aby nemohl slíbit trefu, kterou seslání
   neudělá. Šířka je skutečná šířka koridoru, ne ozdoba, takže je na první
   pohled vidět, jak přesně se musí mířit. */
function kresliKoridory(sx, sy, m){
  pctx.save();
  for(const k of koridory){
    const trefa = k.zasazeni.length > 0;
    pctx.strokeStyle = trefa ? "rgba(245,110,90,.30)" : "rgba(126,224,168,.18)";
    pctx.lineWidth = Math.max(2, k.sirka * m);
    pctx.lineCap = "round";
    pctx.beginPath();
    pctx.moveTo(sx(k.odkud[0]), sy(k.odkud[1]));
    pctx.lineTo(sx(k.konec[0]), sy(k.konec[1]));
    pctx.stroke();
    // Zasažené se obtáhnou, ať se nemusí hádat, jestli okraj pásu ještě bere.
    pctx.strokeStyle = "#f56e5a"; pctx.lineWidth = 2; pctx.setLineDash([]);
    for(const id of k.zasazeni){
      const o = ((planStav && planStav.objekty) || []).find(x=>x.id === id);
      if(!o || !o.pozice) continue;
      pctx.beginPath();
      pctx.arc(sx(o.pozice[0]), sy(o.pozice[1]), 9, 0, Math.PI*2);
      pctx.stroke();
    }
  }
  pctx.restore();
}

/* Zamýšlená cesta: lomená čára po TÝCHŽ bodech, po kterých se pak opravdu
   půjde (`trasa` ze serveru), a křížek na cíli. Nedostupný cíl se kreslí
   varovně — hráč má vidět, že tudy ne, ne to zjistit až z hlášky. */
function kresliChuzi(ja, sx, sy){
  const spatne = !!chuze.chyba;
  pctx.save();
  pctx.strokeStyle = spatne ? "#f5a742" : "#7ee0a8";
  pctx.lineWidth = 1.5;
  pctx.setLineDash([4, 3]);
  if(chuze.body && chuze.body.length && ja){
    pctx.beginPath();
    pctx.moveTo(sx(ja.pozice[0]), sy(ja.pozice[1]));
    for(const b of chuze.body) pctx.lineTo(sx(b[0]), sy(b[1]));
    pctx.stroke();
  }
  pctx.setLineDash([]);
  const [cx, cy] = [sx(chuze.cil[0]), sy(chuze.cil[1])];
  pctx.beginPath();
  pctx.moveTo(cx-5, cy-5); pctx.lineTo(cx+5, cy+5);
  pctx.moveTo(cx+5, cy-5); pctx.lineTo(cx-5, cy+5);
  pctx.stroke();
  pctx.restore();
}

/* Kam se čaroděj dívá. Kreslí se BLEDĚ, dokud nemá vlastní `zorne_pole` —
   výkres nemá slibovat mechaniku, která ve scéně není zapsaná. */
function kresliSmerHrace(ja, sx, sy, m){
  if(ja.smer == null) return;
  const c = [sx(ja.pozice[0]), sy(ja.pozice[1])];
  const uhel = -ja.smer * Math.PI/180, delka = Math.max(18, 1.2*m);
  pctx.save();
  pctx.strokeStyle = "#7ee0a8"; pctx.lineWidth = 2;
  pctx.beginPath(); pctx.moveTo(c[0], c[1]);
  pctx.lineTo(c[0] + Math.cos(uhel)*delka, c[1] + Math.sin(uhel)*delka);
  pctx.stroke();
  pctx.restore();
}

/* Klik = označit cíl. Vybírá se NEJBLIŽŠÍ kus k prstu, ne první v seznamu —
   překryté puntíky by jinak šly odklikat jen některé. */
plan.onclick = ev => {
  const st = planStav;
  if(!st || !st.prevod) return;
  const r = plan.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const {sx, sy} = st.prevod;
  let nejlepsi = null, nejmin = 26;             // dosah prstu v pixelech
  for(const o of st.objekty){
    /* CO SE NEKRESLÍ, NEJDE TREFIT. Dřív šel klepnutím označit i kus mimo
       dohled — poťukáním do prázdna se dalo zjistit, že tam něco je.
       `nabidneVykres` je totéž kritérium, podle kterého se pod výkresem
       nabízejí kusy, na které se klepnout nedá; dvě čtení by se rozešla. */
    if((!o.vidis && !ladeniVse) || !nabidneVykres(o)) continue;
    const d = Math.hypot(sx(o.pozice[0]) - px, sy(o.pozice[1]) - py);
    if(d < nejmin){ nejmin = d; nejlepsi = o; }
  }
  if(!nejlepsi){                                   // do volna = KAM JÍT
    vybranyId = null; coinPos = null;              // …a zavři coin
    $("#detail").style.display = "none";
    vezmiCilChuze(px, py); return;
  }
  /* Klepnutí VYBÍRÁ, necílí. Cílení (👉) je první tlačítko v rozbalené kartě:
     jedno gesto, jeden význam, žádné skryté dlouhé stisky. Označit víc kusů
     naráz jde dál — karta je pro každý zvlášť. Coin se otevře U KUSU: jeho bod
     na plátně dodá `sx/sy`. */
  vyberKus(nejlepsi.id, {x: sx(nejlepsi.pozice[0]), y: sy(nejlepsi.pozice[1])});
};

/* Klik do prázdna: zeptej se JÁDRA, kudy a za kolik by se tam šlo, a ukaž to.
   Přepočet z pixelů na kroky je jediná geometrie, kterou tenhle soubor dělá —
   trasu ani cenu si nepočítá, aby výkres nemohl slíbit cestu, kterou pak
   sloveso `jdi na` odmítne. */
async function vezmiCilChuze(px, py){
  const st = planStav;
  if(!st || !st.prevod) return;
  const {sx, sy, m, x0, y0, vys, okraj} = st.prevod;
  const x = (px - okraj) / m + x0, y = (vys - okraj - py) / m + y0;
  chuze = {cil: [+x.toFixed(2), +y.toFixed(2)], body: null, kroky: null,
           chyba: null, ceka: true};
  ukazChuzi(); kresliPlan();
  const r = await api("/api/trasa", {x: chuze.cil[0], y: chuze.cil[1]});
  if(!chuze) return;                       // mezitím zrušeno
  chuze = {cil: r.cil || chuze.cil, body: r.body, kroky: r.kroky,
           chyba: r.chyba, ceka: false};
  ukazChuzi(); kresliPlan();
}

/* Lišta označeného místa: JEDEN bod, dvě nabídnuté akce. Míření se na trasu
   neptá a nemůže selhat cestou (otáčení je zadarmo a nepotřebuje výhled), tak
   je 🧭 aktivní i tam, kam se dojít nedá — za zeď se člověk podívat může,
   dojít ne. Čeká se jen na cenu chůze, kterou počítá server. */
function ukazChuzi(){
  const bar = $("#walkBar"), info = $("#walkInfo"), btn = $("#walkBtn");
  if(!chuze){ bar.style.display = "none"; return; }
  bar.style.display = "flex";
  if(chuze.ceka){ info.textContent = "…"; info.className = ""; btn.disabled = true; return; }
  btn.disabled = !!chuze.chyba;
  info.textContent = chuze.chyba
    ? chuze.chyba
    : `${chuze.kroky} kroku — chůze stojí čas (§39)`;
  info.className = chuze.chyba ? "bad" : "";
}

function zrusChuzi(){ chuze = null; ukazChuzi(); kresliPlan(); }

$("#walkBtn").onclick = async ()=>{
  if(!chuze || chuze.chyba) return;
  const [x, y] = chuze.cil;
  zrusChuzi();
  await doAction(`jdi na ${x} ${y}`);
};
$("#aimBtn").onclick = async ()=>{
  if(!chuze) return;
  const [x, y] = chuze.cil;
  zrusChuzi();
  await doAction(`otoč se na ${x} ${y}`);
};
$("#walkCancel").onclick = zrusChuzi;
window.addEventListener("resize", kresliPlan);

let NAHLED_KLIC = "sklad";
async function api(path, body){
  if(path === "/api/reset" && body && NAHLED_SCENY[body.klic]){
    NAHLED_KLIC = body.klic;
    return JSON.parse(JSON.stringify(NAHLED_SCENY[NAHLED_KLIC]));
  }
  const hlaska = "Náhled rozvržení běží bez serveru — kouzla, chůze, krok času ani ukládání tu neběží.";
  return { ok:false, chyba:hlaska, zpravy:[hlaska] };
}
async function refresh(){ render(JSON.parse(JSON.stringify(NAHLED_SCENY[NAHLED_KLIC]))); }

// Zapíše záznam do Kroniky a ZRCADLÍ ho jako poslední výsledek nad řádkem.
function pridejZaznam(html){
  const div = document.createElement("div");
  div.className = "entry";
  div.innerHTML = html;
  $("#log").prepend(div);
  const last = $("#lastResult");
  last.className = "lastresult";
  last.innerHTML = `<div class="entry">${html}</div>`;
}
function logCast(text, res){
  let html;
  if(!res.ok){
    html = `<div class="cmd">${text}</div><div class="msg err">✖ ${res.chyba}</div>`;
  } else {
    const cls = res.vyusteni.includes("čisté")?"b-ok":(res.vyusteni.includes("fatální")?"b-bad":"b-warn");
    const raz = res.razeni?` <span class="badge b-warn">⚒ raženo</span>`:"";
    const vyr = res.vyreseno?` <span class="badge b-ok">✔ vyřešeno</span>`:"";
    const zbytek = res.mana_max>0 ? ` · nádrž ${res.mana_zbyva}/${res.mana_max}` : "";
    html = `<div class="cmd">${text}</div>
      <div class="meta">mana ${res.mana}${zbytek} · šance ${Math.round(res.sance*100)}% ·
        výklad ${res.vyklad} <span class="badge ${cls}">${res.vyusteni}</span>${raz}${vyr}</div>
      ${res.zpravy.map(z=>`<div class="msg">${z}</div>`).join("")}`;
  }
  pridejZaznam(html);
}
function logTick(res){
  pridejZaznam(`<div class="cmd">⏱ krok času</div>` +
    res.zpravy.map(z=>`<div class="msg">${z}</div>`).join(""));
}
function logAction(text, res){
  let html;
  if(!res.ok){
    html = `<div class="cmd">🎬 ${text}</div><div class="msg err">✖ ${res.chyba}</div>`;
  } else {
    const vyr = res.vyreseno?` <span class="badge b-ok">✔ vyřešeno</span>`:"";
    html = `<div class="cmd">🎬 ${text}${vyr}</div>` +
      (res.zpravy||[]).map(z=>`<div class="msg">${z}</div>`).join("");
  }
  pridejZaznam(html);
}
async function doAction(text){
  if(!text || !text.trim()) return;
  const res = await api("/api/manipulate", {text});
  logAction(text, res);
  await refresh();
}

// Živý náhled ceny/šance/validace nad řádkem (§10-11). Debounce, ať se neposílá
// dotaz na každý stisk; poslední odpověď vyhrává.
let previewTimer = null, previewSeq = 0;
function schedulePreview(){ clearTimeout(previewTimer); previewTimer = setTimeout(runPreview, 130); }
async function runPreview(){
  const box = $("#preview");
  const text = $("#spell") ? $("#spell").value : "";
  if(!text.trim()){ box.className = "preview empty"; box.innerHTML = "";
                    if(koridory.length){ koridory = []; kresliPlan(); } return; }
  const seq = ++previewSeq;
  const r = await api("/api/preview", {text, cerpej:[...cerpej], ukaz_ids:[...ukazIds]});
  if(seq !== previewSeq) return;                 // dorazila starší odpověď — zahoď
  // Neúspěch (404 staré instance serveru, výpadek…) náhled jen skryje — nikdy
  // nevypisuj syrovou serverovou chybu do lišty náhledu.
  if(!r || !r.ok || r.prazdno){ box.className = "preview empty"; box.innerHTML = "";
                                koridory = []; kresliPlan(); return; }
  // Pás se kreslí i u kouzla, na které zatím nemáš manu: „kam to letí" je
  // otázka natočení, ne peněženky, a hráč podle něj míří DŘÍV, než dopíše.
  koridory = r.koridory || [];
  kresliPlan();
  box.className = "preview";
  if(!r.platne){
    box.innerHTML = `<span class="pv bad">✖ ${r.chyba || "kouzlo zatím nedrží tvar"}</span>`;
    return;
  }
  const pct = Math.round(r.sance*100);
  const sCls = pct>=70 ? "ok" : (pct>=40 ? "warn" : "bad");
  const mCls = r.dost_many ? "" : "bad";
  const amb = r.pocet_vykladu>1
    ? `<span class="pv warn">⚑ nejednoznačné (${r.pocet_vykladu} výklady — sešli „na sílu“)</span>` : "";
  box.innerHTML =
    `<span class="pv ok">✔ drží tvar</span>` +
    `<span class="pv">mana <b class="${mCls}">${r.mana}</b></span>` +
    `<span class="pv">šance <b class="${sCls}">${pct}%</b></span>` + amb;
}

$("#castBtn").onclick = async ()=>{
  const text = $("#spell").value.trim();
  if(!text) return;
  const res = await api("/api/cast", {text, cerpej:[...cerpej], ukaz_ids:[...ukazIds],
                                      na_silu:$("#force").checked});
  logCast(text, res);
  await refresh();
};
$("#spell").addEventListener("input", schedulePreview);
$("#spell").addEventListener("keydown", e=>{
  if(e.key==="Enter") $("#castBtn").click();
  if(e.key==="Escape"){ e.target.value=""; schedulePreview(); }
});
$("#clearBtn").onclick = ()=>{ const inp=$("#spell"); inp.value=""; inp.focus(); schedulePreview(); };

// Akce se světem (manipulace, §8.4) — druhý vstupní jazyk.
$("#actBtn").onclick = async ()=>{
  const inp = $("#action"); const t = inp.value.trim();
  if(!t) return;
  await doAction(t); inp.value="";
};
$("#action").addEventListener("keydown", e=>{
  if(e.key==="Enter") $("#actBtn").click();
  if(e.key==="Escape"){ e.target.value=""; }
});

$("#tickBtn").onclick = async ()=>{ logTick(await api("/api/tick")); await refresh(); };

async function restartScenu(){
  cerpej.clear(); ukazIds.clear();
  $("#lastResult").className = "lastresult empty";   // nová scéna → skryj starý výsledek
  $("#lastResult").innerHTML = "";
  // prenes = přenos znalostí/kouzel mezi místnostmi bez přepsání (§8.3).
  render(await api("/api/reset", {klic: $("#scenePick").value, prenes: $("#prenes").checked}));
}
$("#resetBtn").onclick = restartScenu;
$("#scenePick").onchange = restartScenu;

/* Uložit/Načíst. Autosave (server s `--hra`) tuhle dvojici nenahrazuje:
   tam se partie drží sama a tlačítko jen potvrzuje, co se stejně děje —
   proto to popisek říká nahlas, místo aby se dvojí režim tvářil stejně. */
$("#saveBtn").onclick = async ()=>{
  const r = await api("/api/save");
  pridejZaznam(r.ok ? `<div class="msg">💾 Partie uložena → <code>${r.kam}</code></div>`
                    : `<div class="msg err">✖ ${r.chyba}</div>`);
  if(r.ulozeni) ukazUlozeni(r.ulozeni);
};
$("#loadBtn").onclick = async ()=>{
  const r = await api("/api/load");
  if(!r.ok){ pridejZaznam(`<div class="msg err">✖ ${r.chyba}</div>`); return; }
  cerpej.clear(); ukazIds.clear();          // označení patřilo staré scéně
  render(r);
  pridejZaznam(`<div class="msg">📂 Navázáno na uloženou partii.</div>`);
};

/* „Načíst" se bez souboru netváří jako funkční — UI nemá slibovat, co není. */
function ukazUlozeni(u){
  if(!u) return;
  const load = $("#loadBtn");
  load.disabled = !u.existuje;
  load.title = u.existuje ? `Vrátí se k uložené partii (${u.soubor}).`
                          : "Zatím není co načíst — nejdřív ulož.";
  $("#saveBtn").title = u.autosave
    ? `Partie se ukládá sama do ${u.soubor}; tlačítko ji uloží hned.`
    : `Uloží rozehranou partii do ${u.soubor}.`;
}

$("#readBtn").onclick = async ()=>{
  const text = $("#scroll").value.trim(); if(!text) return;
  const r = await api("/api/read", {text});
  const out = $("#readOut");
  if(!r.ok){ out.innerHTML = `<span class="err">✖ ${r.chyba}</span>`; return; }
  let h = `<div class="zam">${r.zamlzeno}</div>`;
  if(r.plne_citelne && r.popis) h += `<p>✔ Plně čitelné: ${r.popis.split("\\n")[0]}</p>`;
  else if(r.nejednoznacne) h += `<p>Runy znáš, ale kouzlo má ${r.pocet_vykladu} výklady — záměr autora skryt (šifra §9.2).</p>`;
  else h += `<p>Zamlženo. Neznámé runy: <b>${r.nezname.map(n=>n.nazev).join(", ")||"—"}</b></p>`;
  for(const l of r.latentni) h += `<p>⋯ latentní význam <b>${l.nazev}</b>: ${l.jadro} — ${l.napoveda}</p>`;
  if(r.nezname && r.nezname.length){
    h += `<div class="decomp">Rozlož střípek (naučíš se runu, §7): ` +
      r.nezname.map(n=>`<button class="dbtn" data-id="${n.id}">◇ ${n.nazev}</button>`).join("") +
      `</div>`;
  }
  out.innerHTML = h;
};
$("#scroll").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#readBtn").click(); });

$("#detailZavri").onclick = ()=>{ vyberKus(null); };

/* PŘEPÍNAČ KOUZLENÍ. Překlápí dílnu mezi dobrodružnou plochou a sesíláním:
   zapnuto přidá třídu `kouzli`, kterou CSS odkryje runy a řádek seslání.
   Výchozí je vypnuto — hráč se nejdřív rozkouká a hýbe, kouzlit zapne. */
const kouzliToggle = $("#kouzliToggle");
kouzliToggle.onclick = () => {
  $("#dilna").classList.toggle("kouzli", kouzliToggle.checked);
  $("#kouzliZnacka").textContent = kouzliToggle.checked ? "— zapnuto" : "— vypnuto";
};

/* LADICÍ „zobrazit vše". Jen překlopí příznak a překreslí — je to VĚC POHLEDU,
   ne tah, takže nejde na server (stav včetně skrytých kusů už v prohlížeči je).
   Překreslí plátno i řádek „mimo výkres" a obnoví obsluhu jejich tlačítek. */
$("#ladeniVse").onclick = e => {
  ladeniVse = e.target.checked;
  if(!ladeniVse) zastavCas();     // přehrávka je ladicí věc, s režimem končí
  ukazCasTlacitko();
  kresliPlan();
  if(planStav) vykresliMimoVykres(planStav.objekty);
  bindObjButtons();
};

/* PŘEHRÁVÁNÍ ZAPEČENÉ OBCHŮZKY (§9).
   Kudy hlídka jde a kam přitom kouká, spočítal engine v Pythonu
   (`generuj_pudorys.py`) a JS to jen PŘEHRÁVÁ — týž postup jako u zóny pohybu
   a klínu, jen v čase. Vlastní krokování tady by byla druhá pravda o cestě.
   Takty platí pro rozestavení ZE SOUBORU, takže přehrávač existuje jen tam,
   kde je scéna netknutá a engine neběží (náhled), a jen v ladicím režimu. */
let casHodiny = null, casTakt = 0;

function taktyScenu(){
  return (typeof TAKTY_CHUZE !== "undefined" && planStav)
    ? TAKTY_CHUZE[planStav.klic] : null;
}

function ukazCasTlacitko(){
  const ch = taktyScenu();
  $("#casBtn").style.display = (ladeniVse && ch) ? "" : "none";
  $("#casBtn").textContent = !casHodiny ? (casTakt ? "▶ " + casTakt : "▶ čas")
                                        : "⏸ " + casTakt + "/" + (ch.takty.length - 1);
}

/* Postaví scénu do zvoleného taktu. Nula se bere ZE ZAPEČENÉ SCÉNY, ne ze
   snímku: snímek nese čísla, a zapsaná nula se od chybějícího údaje nepozná —
   vracení na nulu by scénu tiše měnilo. Táž úmluva jako v editoru. */
function nastavTakt(i){
  const ch = taktyScenu();
  if(!ch) return;
  const kolik = ch.takty.length;
  casTakt = ((i % kolik) + kolik) % kolik;
  const cisty = NAHLED_SCENY[planStav.klic].scena.objekty;
  for(const o of planStav.objekty){
    const v = ch.takty[casTakt][o.id];
    if(v){ o.pozice = [v[0], v[1]]; o.z = v[2]; o.smer = v[3]; }
    else if(casTakt === 0){
      const p = cisty.find(z => z.id === o.id);
      if(p){ o.pozice = p.pozice; o.z = p.z; o.smer = p.smer; }
    }
    // Klín se bere z taktu VŠEM, ne jen chodcům: otočit hlídku umí i spoušť.
    const k = ch.kliny[casTakt][o.id];
    if(k) o.klin = k;
  }
  ukazCasTlacitko();
  kresliPlan();
}

function zastavCas(naNulu){
  if(casHodiny){ clearInterval(casHodiny); casHodiny = null; }
  if(naNulu) nastavTakt(0);
  ukazCasTlacitko();
}

$("#casBtn").onclick = () => {
  if(casHodiny){ zastavCas(); return; }
  casHodiny = setInterval(() => nastavTakt(casTakt + 1), 700);
  ukazCasTlacitko();
};

refresh();
</script>
