<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine runová věta — lexer + parser (JS vs Python)</title>
<!--
  Živá ukázka kroku 3, dílů 2a+2b: lexer a parser runové věty. Napíšeš kouzlo,
  engine ho rozseká na tokeny (obarvené podle slovního druhu) a složí do stromu
  (AST) — u sloučených sloves ukáže VÍC výkladů. Neznámé slovo i gramatická
  chyba → šipka na pozici, jako by to vypsal Python. Importuje SKUTEČNÝ
  `engine/parser.js` + `engine/lexikon.js` (ne kopii) — tentýž kód jako
  `npm test`. Odznak „= python" ověří proti vzorku fixtur. #havarie chytí
  nenačtený engine, ať na telefonu nemlčí.
-->
<style>
  :root { color-scheme: light dark;
    --sloveso:#c0392b; --podstata:#2471a3; --cil:#1e8449;
    --forma:#7d3c98; --modifikator:#b9770e; --spojka:#5d6d7e; --jmeno:#117a65; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem;
         max-width: 46rem; margin-inline: auto; }
  h1 { font-size: 1.25rem; }
  #havarie { display: none; background: #f3d9d9; color: #7a1f1f;
             padding: .75rem; border-radius: .5rem; white-space: pre-wrap;
             font-family: ui-monospace, monospace; font-size: 13px; }
  #odznak { display: inline-block; font-weight: 600; padding: .3rem .6rem;
            border-radius: .5rem; background: #e8f0e8; font-size: .85rem; }
  #odznak.spatne { background: #f3d9d9; }
  .hracka { background: #0001; border-radius: .6rem; padding: 1rem; margin: 1rem 0; }
  .hracka label { display: block; font-size: .8rem; color: #666; margin-bottom: .2rem; }
  .hracka input { font: inherit; padding: .5rem .6rem; border-radius: .4rem;
                  border: 1px solid #8886; width: 100%; box-sizing: border-box;
                  background: transparent; color: inherit; }
  .priklady { margin: .6rem 0 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .priklady button { font: .82rem/1 inherit; padding: .35rem .6rem; border-radius: 1rem;
                     border: 1px solid #8886; background: transparent; color: inherit;
                     cursor: pointer; }
  #tokeny { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 .5rem; }
  .tok { border-radius: .5rem; padding: .35rem .6rem; color: #fff;
         display: flex; flex-direction: column; line-height: 1.15; }
  .tok b { font-size: 1rem; }
  .tok small { font-size: .7rem; opacity: .85; }
  .tok.zav { background: transparent; color: #888; border: 1px dashed #8888;
             justify-content: center; font-family: ui-monospace, monospace; }
  #chyba { display: none; background: #f3d9d9; color: #7a1f1f; border-radius: .5rem;
           padding: .6rem .75rem; font-family: ui-monospace, monospace;
           white-space: pre; font-size: 14px; overflow-x: auto; }
  .chip { display: inline-block; border-radius: .4rem; padding: .12rem .45rem;
          color: #fff; font-size: .85rem; margin: .1rem .2rem .1rem 0; }
  .vyklad { border: 1px solid #8883; border-radius: .5rem; padding: .5rem .6rem;
            margin: .5rem 0; }
  .vyklad > .cislo { font-size: .75rem; color: #666; margin-bottom: .3rem; }
  .uzel { border-left: 2px solid #8884; padding-left: .6rem; margin: .3rem 0 .3rem .1rem; }
  .uzelhlava { font-size: .8rem; color: #555; font-weight: 600; margin-bottom: .15rem; }
  .slot { display: flex; align-items: baseline; flex-wrap: wrap; gap: .15rem; margin: .1rem 0; }
  .slot .lbl { font-size: .72rem; color: #888; min-width: 4.5rem; }
  .legenda { display: flex; flex-wrap: wrap; gap: .75rem; font-size: .8rem;
             color: #666; margin: .5rem 0 0; }
  .kap { display: inline-block; width: .7rem; height: .7rem; border-radius: .2rem;
         margin-right: .3rem; vertical-align: middle; }
  #validace { border-radius: .5rem; padding: .5rem .7rem; margin: .3rem 0 .6rem;
              font-size: .9rem; }
  #validace.ano { background: #e8f0e8; color: #205020; }
  #validace.ne { background: #f6ecd8; color: #7a5a1f; }
  #naceneni { font-size: .9rem; color: #555; margin: -.2rem 0 .6rem;
              font-family: ui-monospace, monospace; }
  h2 { font-size: 1rem; margin: 1.4rem 0 .25rem; }
</style>

<h1>Runová věta — lexer + parser, JS proti Python oracle</h1>
<div id="havarie"></div>
<p><span id="odznak">Ověřuji…</span></p>

<div class="hracka">
  <label for="text">Kouzlo (runová věta)</label>
  <input id="text" value="Zažehni Oheň Nepřítel" autocomplete="off" autocapitalize="off">
  <div class="priklady" id="priklady"></div>
  <label for="faze" style="margin-top:.7rem">Fáze progrese čaroděje: <b id="fazeCislo">7</b> / 7
    <span style="color:#888">(zná všechny runy)</span></label>
  <input id="faze" type="range" min="0" max="7" value="7" style="width:100%">
  <label for="mastery" style="margin-top:.5rem">Ovládnutí run (mastery): <b id="masteryCislo">0</b> %</label>
  <input id="mastery" type="range" min="0" max="100" value="0" style="width:100%">
</div>

<div id="chyba"></div>

<h2>Tokeny</h2>
<div id="tokeny"></div>
<div class="legenda" id="legenda"></div>

<h2>Strom (AST) — výklady</h2>
<div id="validace"></div>
<div id="naceneni"></div>
<div id="strom"></div>

<script type="module">
import { zakladLexikon } from "./engine/lexikon.js";
import { lexuj, parsuj } from "./engine/parser.js";
import { zvaliduj } from "./engine/validator.js";
import { nacen } from "./engine/costs.js";
import { Znalosti } from "./engine/progression.js";
import { ChybaKouzla, NeznameSlovo } from "./engine/errors.js";

const havarie = (t) => { const e = document.getElementById("havarie");
  e.style.display = "block"; e.textContent = "Engine se nenačetl:\n" + t; };

try {
  const lex = zakladLexikon();
  const DRUHY = ["sloveso", "podstata", "cil", "forma", "modifikator", "spojka", "jmeno"];
  const barva = (d) => `var(--${d})`;

  const legenda = document.getElementById("legenda");
  for (const d of DRUHY) {
    const s = document.createElement("span");
    s.innerHTML = `<i class="kap" style="background:${barva(d)}"></i>${d}`;
    legenda.appendChild(s);
  }

  const text = document.getElementById("text");
  const tokenyEl = document.getElementById("tokeny");
  const stromEl = document.getElementById("strom");
  const chybaEl = document.getElementById("chyba");
  const validaceEl = document.getElementById("validace");
  const naceneniEl = document.getElementById("naceneni");
  const fazeEl = document.getElementById("faze");
  const fazeCisloEl = document.getElementById("fazeCislo");
  const masteryEl = document.getElementById("mastery");
  const masteryCisloEl = document.getElementById("masteryCislo");
  const vsechnyRuny = Object.keys(lex.runy);

  const PRIKLADY = [
    "Zažehni Oheň Nepřítel",
    "Zažehni Rozbij Nepřítel",
    "Zažehni Oheň a Zmraz Nepřítel silně",
    "pokud ne ( Nepřítel Oheň ) pak Zhoj Já",
    "Přesuň Já skrze Spojení",
    "Zažehni ne Oheň Nepřítel:Kámen",
    "Zažehni Oheň )",
  ];
  const priklady = document.getElementById("priklady");
  for (const p of PRIKLADY) {
    const b = document.createElement("button");
    b.textContent = p;
    b.addEventListener("click", () => { text.value = p; prekresli(); });
    priklady.appendChild(b);
  }

  // Runová "pilulka" obarvená podle druhu (i pro odvozené: negace/zúžení mění název).
  function chip(r) {
    const s = document.createElement("span");
    s.className = "chip";
    s.style.background = barva(r.druh);
    s.textContent = r.nazev;
    return s;
  }

  // Rekurzivní vykreslení AST uzlu.
  function strom(u) {
    const box = document.createElement("div");
    box.className = "uzel";
    const hlava = document.createElement("div");
    hlava.className = "uzelhlava";
    box.appendChild(hlava);
    const slot = (label, runy) => {
      if (!runy || !runy.length) return;
      const d = document.createElement("div");
      d.className = "slot";
      const l = document.createElement("span");
      l.className = "lbl"; l.textContent = label;
      d.appendChild(l);
      for (const r of runy) d.appendChild(chip(r));
      box.appendChild(d);
    };
    if (u.typ === "Fraze") {
      hlava.textContent = "fráze";
      slot("sloveso", u.sloveso); slot("podstata", u.podstaty); slot("cíl", u.cile);
      slot("forma", u.formy); slot("modifikátor", u.modifikatory);
    } else if (u.typ === "Volani") {
      hlava.append("volání "); hlava.appendChild(chip(u.jmeno));
      slot("podstata", u.podstaty); slot("cíl", u.cile);
      slot("forma", u.formy); slot("modifikátor", u.modifikatory);
    } else if (u.typ === "Skupina") {
      hlava.textContent = "blok ( … )";
      box.appendChild(strom(u.vyraz));
      slot("+ cíl", u.cile); slot("+ modifikátor", u.modifikatory);
    } else if (u.typ === "Spojeni") {
      hlava.textContent = u.operator === "a" ? "a — paralelně" : "pak — sekvenčně";
      for (const c of u.casti) box.appendChild(strom(c));
    } else if (u.typ === "Podminka") {
      hlava.textContent = `pokud ${u.negace ? "ne " : ""}( … ) pak`;
      slot("cíl", [u.cil]); slot("stav", u.stavy);
      const t = document.createElement("div");
      t.className = "slot";
      const l = document.createElement("span"); l.className = "lbl"; l.textContent = "pak";
      t.appendChild(l); box.appendChild(t);
      box.appendChild(strom(u.telo));
    } else if (u.typ === "Skrze") {
      hlava.textContent = "skrze — kanálem";
      box.appendChild(strom(u.vyraz));
      slot("kanál", u.kanal ? [u.kanal] : []);
    }
    return box;
  }

  function ukazChybu(e) {
    const sipka = " ".repeat(e.pozice ?? 0) + "^";
    chybaEl.textContent = `${e.zprava}\n${text.value}\n${sipka}`;
    chybaEl.style.display = "block";
  }

  function prekresli() {
    tokenyEl.innerHTML = "";
    stromEl.innerHTML = "";
    validaceEl.textContent = "";
    validaceEl.className = "";
    naceneniEl.textContent = "";
    chybaEl.style.display = "none";

    // Tokeny (i když parser níž spadne na gramatice, tokeny ukážeme).
    let tokeny = null;
    try {
      tokeny = lexuj(text.value, lex);
    } catch (e) {
      if (e instanceof NeznameSlovo) { ukazChybu(e); return; }
      throw e;
    }
    for (const t of tokeny) {
      const el = document.createElement("div");
      if (t.runa === null) { el.className = "tok zav"; el.textContent = t.text; }
      else {
        el.className = "tok";
        el.style.background = barva(t.runa.druh);
        el.innerHTML = `<b>${t.text}</b><small>${t.runa.druh}</small>`;
      }
      tokenyEl.appendChild(el);
    }

    // Strom (výklady).
    let vyklady;
    try {
      vyklady = parsuj(text.value, lex);
    } catch (e) {
      if (e instanceof ChybaKouzla) { ukazChybu(e); return; }
      throw e;
    }
    vyklady.forEach((u, i) => {
      const v = document.createElement("div");
      v.className = "vyklad";
      if (vyklady.length > 1) {
        const c = document.createElement("div");
        c.className = "cislo"; c.textContent = `výklad ${i + 1} z ${vyklady.length}`;
        v.appendChild(c);
      }
      v.appendChild(strom(u));
      stromEl.appendChild(v);
    });

    // Znalosti podle posuvníků: čaroděj zná všechny runy (fáze rozhoduje o
    // gramatice, mastery o ceně a šanci).
    const faze = Number(fazeEl.value);
    const m = Number(masteryEl.value) / 100;
    const mastery = {};
    for (const id of vsechnyRuny) mastery[id] = m;
    const zn = new Znalosti({ runy: vsechnyRuny, faze, mastery });

    try {
      zvaliduj(vyklady[0], zn);
      validaceEl.className = "ano";
      validaceEl.textContent = `✓ ve fázi ${faze} tohle kouzlo sešleš`;
    } catch (e) {
      if (e instanceof ChybaKouzla) {
        validaceEl.className = "ne";
        validaceEl.textContent = `✗ ${e.zprava}`;
      } else {
        throw e;
      }
    }

    // Cena prvního výkladu při zvolené mastery (mana klesá, šance roste s ovládnutím).
    const n = nacen(vyklady[0], lex, zn);
    const nejsl = n.nejslabsi ? lex.runy[n.nejslabsi].nazev : "—";
    naceneniEl.textContent =
      `mana ${n.cenaMany.toFixed(1)} · šance ${Math.round(n.sance * 100)} % · `
      + `obtížnost ${n.obtiznost.toFixed(1)} · nejslabší runa: ${nejsl}`;
  }

  fazeEl.addEventListener("input", () => {
    fazeCisloEl.textContent = fazeEl.value;
    prekresli();
  });
  masteryEl.addEventListener("input", () => {
    masteryCisloEl.textContent = masteryEl.value;
    prekresli();
  });

  text.addEventListener("input", prekresli);
  prekresli();

  // Odznak: přehraj vzorek fixtur parseru (výklady i chyby) a spočítej shody.
  const odznak = document.getElementById("odznak");
  const kanon = (x) => Array.isArray(x) ? "[" + x.map(kanon).join(",") + "]"
    : (x !== null && typeof x === "object")
      ? "{" + Object.keys(x).sort().map((k) => JSON.stringify(k) + ":" + kanon(x[k])).join(",") + "}"
      : JSON.stringify(x);
  const serR = (r) => ({ id: r.id, nazev: r.nazev, data: serD(r.data) });
  const serD = (d) => { const o = {}; for (const [k, v] of Object.entries(d)) o[k] = k === "filtr" ? v.map(serR) : v; return o; };
  function serU(u) {
    if (u.typ === "Fraze") return { typ: "Fraze", sloveso: u.sloveso.map(serR), podstaty: u.podstaty.map(serR), cile: u.cile.map(serR), formy: u.formy.map(serR), modifikatory: u.modifikatory.map(serR) };
    if (u.typ === "Volani") return { typ: "Volani", jmeno: serR(u.jmeno), podstaty: u.podstaty.map(serR), cile: u.cile.map(serR), formy: u.formy.map(serR), modifikatory: u.modifikatory.map(serR) };
    if (u.typ === "Skupina") return { typ: "Skupina", vyraz: serU(u.vyraz), cile: u.cile.map(serR), modifikatory: u.modifikatory.map(serR) };
    if (u.typ === "Spojeni") return { typ: "Spojeni", operator: u.operator, casti: u.casti.map(serU) };
    if (u.typ === "Podminka") return { typ: "Podminka", cil: serR(u.cil), stavy: u.stavy.map(serR), telo: serU(u.telo), negace: u.negace };
    return { typ: "Skrze", vyraz: serU(u.vyraz), kanal: u.kanal ? serR(u.kanal) : null };
  }
  try {
    const fix = await (await fetch("./test/fixtury_parser.json")).json();
    let sedi = 0, celkem = 0;
    for (const c of fix.parser) {
      celkem++;
      try {
        const v = parsuj(c.text, lex);
        if (c.chyba === undefined && kanon(v.map(serU)) === kanon(c.vyklady)) sedi++;
      } catch (e) {
        if (c.chyba !== undefined && e instanceof ChybaKouzla && e.name === c.chyba && e.pozice === c.pozice) sedi++;
      }
    }
    odznak.textContent = sedi === celkem
      ? `= python (${sedi}/${celkem} případů)`
      : `≠ python (${celkem - sedi} rozdílů)`;
    if (sedi !== celkem) odznak.classList.add("spatne");
  } catch (e) {
    odznak.textContent = "odznak jen na webu (fetch)";
  }
} catch (e) {
  havarie((e && e.stack) || String(e));
}
</script>
