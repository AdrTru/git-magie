<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Půdorys — vsc-magie</title>
<style>
:root{
  --papir:#0b1a2b;        /* cyanotypie: půdorys je modrotisk */
  --mrizka:rgba(150,200,230,.06);
  --mrizka-hlavni:rgba(150,200,230,.13);
  --tuz:#9fd3e8;          /* obrys */
  --clona:#c9a5f0;        /* brání výhledu, ne pohybu */
  --text:#d3e6f0;
  --tise:#6f8ba0;
  --znacka:#f5a742;       /* vybraný objekt — jediná teplá barva na výkrese */
  --zamitnuto:#e0705f;
  --panel:#0e2033;
  --linka:rgba(159,211,232,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--papir);color:var(--text);font-family:var(--ui)}
/* Výkres NESMÍ stát na `height:100%` ani na `position:fixed`. Rám, ve kterém
   se stránka zobrazuje, si výšku může určovat sám podle obsahu — a protože
   obsah je jediné plátno, vyšla by nula a obrazovka zůstane prázdná. `#app`
   proto drží výšku sám a má tvrdé minimum, ať se měří jakkoli. */
#app{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden}
/* POZOR: canvas je NAHRAZOVANÝ element. Samotné `inset:0` ho neroztáhne —
   `width:auto` u něj znamená vlastní velikost 300×150, ne dopočet z left/right.
   Bez explicitních rozměrů se kreslí do rohu pod lištu a plán vypadá prázdný.
   Navíc `plocha.width = …` mění tu vlastní velikost, takže by se plátno
   s každým překreslením roztahovalo. */
#plocha{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#havarie{position:absolute;inset:auto 10px 10px;z-index:20;display:none;padding:10px 12px;
  border:1px solid var(--zamitnuto);border-radius:8px;background:#2a1414;
  color:#f0c0b8;font:12px/1.5 var(--mono);white-space:pre-wrap;max-height:45vh;overflow:auto}

/* --- horní lišta ------------------------------------------------------- */
#lista{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(var(--papir),rgba(11,26,43,.85),transparent);z-index:5}
select,button,input{font-family:var(--ui);font-size:14px;color:var(--text);background:var(--panel);
  border:1px solid var(--linka);border-radius:7px;padding:7px 9px}
select{flex:0 1 auto;min-width:0}
button{cursor:pointer}
button:active{background:#16324c}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--znacka);outline-offset:1px}
#shoda{margin-left:auto;font:600 11px/1 var(--mono);padding:6px 8px;border-radius:6px;white-space:nowrap}
.ok{background:rgba(159,211,232,.12);color:var(--tuz)}
.zle{background:rgba(224,112,95,.18);color:var(--zamitnuto)}

/* --- panel vybraného objektu ------------------------------------------- */
#panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);
  border-top:1px solid var(--linka);border-radius:14px 14px 0 0;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
  transform:translateY(110%);transition:transform .22s ease;max-height:62vh;overflow:auto}
#panel.vidno{transform:none}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
#hlava{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
#nazev{font-weight:600;font-size:15px}
#ident{font:12px var(--mono);color:var(--tise)}
#tagy{font:11px var(--mono);color:var(--tise);margin-bottom:9px}
.mriz{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
label{display:block;font:10px/1.5 var(--mono);color:var(--tise);text-transform:uppercase;letter-spacing:.05em}
input,select.pole{width:100%;font-family:var(--mono);padding:6px 7px;font-size:14px}
#akce{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
#akce button{flex:1 1 auto;min-width:96px}
#mimo{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);right:10px;z-index:4;
  display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#mimo button{font-size:12px;padding:5px 8px;opacity:.75;white-space:nowrap;flex:0 0 auto}
#vypis{position:absolute;inset:0;z-index:9;background:var(--papir);padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;display:none;flex-direction:column;gap:8px}
#vypis textarea{flex:1;width:100%;background:var(--panel);color:var(--text);border:1px solid var(--linka);
  border-radius:8px;padding:9px;font:12px/1.45 var(--mono);resize:none}
</style>
</head>
<body>
<div id="app">
<canvas id="plocha"></canvas>
<div id="havarie"></div>

<div id="lista">
  <select id="volba"></select>
  <button id="mrizka-prep" title="Krok mřížky">0,5</button>
  <button id="zona-prep" title="Kam čaroděj dojde za tah">zóna</button>
  <button id="pozadi-prep" title="Podklad z mapy pod půdorysem">mapa</button>
  <button id="cas-prep" title="Zapečené takty chození (§9) — přehrání, ne výpočet">▶ čas</button>
  <button id="vystup">JSON</button>
  <span id="shoda" class="ok">—</span>
</div>

<div id="mimo"></div>

<div id="panel">
  <div id="hlava"><span id="nazev"></span><span id="ident"></span></div>
  <div id="tagy"></div>
  <div class="mriz">
    <div><label for="p-x">x</label><input id="p-x" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="p-y">y</label><input id="p-y" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="p-z">z (nad podlahou)</label><input id="p-z" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="p-v">výška</label><input id="p-v" type="number" step="0.1" inputmode="decimal" placeholder="do stropu"></div>
    <div><label for="p-tvar">tvar</label><select id="p-tvar" class="pole">
      <option value="bod">bod</option><option value="kruh">kruh</option>
      <option value="usecka">úsečka</option><option value="obdelnik">obdélník</option>
      <option value="lomena">lomená (potok, plot)</option>
      <option value="polygon">polygon (jezírko, plošina)</option></select></div>
    <div id="radek-body" style="display:none"><label for="p-body">vrcholy vůči pozici (x,y; x,y; …)</label>
      <input id="p-body" class="pole" inputmode="decimal" placeholder="-2,0; -0.5,-0.5; 1,0.3; 2,0"></div>
    <div><label for="p-d">délka (podél)</label><input id="p-d" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="p-s">šířka (napříč)</label><input id="p-s" type="number" step="0.1" inputmode="decimal"></div>
    <div><label for="p-smer">směr °</label><input id="p-smer" type="number" step="5" inputmode="decimal"></div>
    <div><label for="p-zp">zorné pole °</label><input id="p-zp" type="number" step="5" inputmode="decimal" placeholder="dokola"></div>
  </div>
  <div id="akce">
    <button id="a-zavri">Zavřít</button>
    <button id="a-zamek">Zamknout 🔒</button>
    <button id="a-konec">Táhnout druhý konec</button>
    <button id="a-zrus">Zrušit pozici</button>
  </div>
</div>

<div id="vypis">
  <textarea id="vypis-text" readonly spellcheck="false"></textarea>
  <div style="display:flex;gap:8px">
    <button id="v-kopie" style="flex:1">Kopírovat</button>
    <button id="v-zpet" style="flex:1">Zpět na půdorys</button>
  </div>
</div>
</div>

   se porovnala a nikdo je neviděl. Přitom je to jediné místo v celém výkrese,
   kde jsou překážky obou os (mříž vidíš skrz a neprojdeš, závěs naopak),
   patra, obrubník i troska — tedy přesně to, co si člověk chce vyzkoušet
   chozením. Sem se přidávají jako obyčejné místnosti; scéna to není a klíč
   je proto odlišený, aby se do `sceny/` nikdy neuložily. */
const MISTNOSTI = Object.assign({}, DATA.sceny);
for(const [nazev, z] of Object.entries(DATA.zkousky || {}))
  MISTNOSTI["zk:" + nazev] = {nazev: "zkouška — " + nazev, objekty: z.objekty};
const jeZkouska = k => k.startsWith("zk:");

/* -- konstanty (prostor.py) ------------------------------------------- */
const DOTEK = 1.5, PRAH_SIRENI = 2.0, PRAH_RETEZENI = 2.5;
const STROP = 1e6, KROK_NAHORU = 0.5, VYSKA_BYTOSTI = 1.8;
const TELO_BYTOSTI = 0.5, TAG_BYTOSTI = "živé";   // průměr, ne poloměr
const ZORNE_POLE_BYTOSTI = 180;   // nezadané = půlrovina, ne rozhled dokola
const VYHLED = "výhled", POHYB = "pohyb";
const PREKAZKY = {
  "zeď":[1,1], "dveře":[1,1], "sloup":[1,1], "skála":[1,1],
  "mříž":[0,1], "plot":[0,1], "propast":[0,1],
  "závěs":[1,0], "kouř":[1,0], "mlha":[1,0],
};
const STAVY_ZRUSENE = ["zničeno","rozbito","otevřeno"];

/* -- geometrie (přepis prostor.py) ------------------------------------ */
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
const posun = (b,o) => [b[0]+o[0], b[1]+o[1]];
function otoc(v, stupne){
  const u = stupne*Math.PI/180, k = Math.cos(u), s = Math.sin(u);
  return [v[0]*k - v[1]*s, v[0]*s + v[1]*k];
}
function rozmer(o){ return o.rozmer || [0,0]; }
const maTag = (o,t) => (o.tagy||[]).some(x => x.toLowerCase() === t.toLowerCase());
const maStav = (o,s) => (o.stavy||[]).some(x => x.toLowerCase() === s.toLowerCase());

function obrys(o){
  const stred = o.pozice;
  if(!stred) return null;
  if(o.pozice_do) return ["usecky", [[stred, o.pozice_do]]];
  const [d, s] = rozmer(o), tvar = o.tvar || "bod", smer = o.smer || 0;
  if(tvar === "kruh") return ["kruh", [stred, d/2]];
  if(tvar === "usecka" && d > 0){
    const pul = otoc([d/2, 0], smer);
    return ["usecky", [[[stred[0]-pul[0], stred[1]-pul[1]], [stred[0]+pul[0], stred[1]+pul[1]]]]];
  }
  if(tvar === "obdelnik" && d > 0 && s > 0){
    const r = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([zx,zy]) => posun(stred, otoc([zx*d/2, zy*s/2], smer)));
    return ["usecky", [0,1,2,3].map(i => [r[i], r[(i+1)%4]])];
  }
  if((tvar === "lomena" || tvar === "polygon") && (o.body||[]).length >= 2){
    const v = o.body.map(b => posun(stred, otoc(b, smer)));
    if(tvar === "polygon") v.push(v[0]);           // uzavře se do prvního
    return ["usecky", v.slice(0,-1).map((a,i) => [a, v[i+1]])];
  }
  if(tvar === "bod" && maTag(o, TAG_BYTOSTI)) return ["kruh", [stred, TELO_BYTOSTI/2]];
  return ["usecky", [[stred, stred]]];          // bod (i nedoměřený tvar)
}

function bodUsecka(bod, u){
  const [[ax,ay],[bx,by]] = u, dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy;
  if(l2 === 0) return dist(bod, u[0]);
  const t = Math.max(0, Math.min(1, ((bod[0]-ax)*dx + (bod[1]-ay)*dy) / l2));
  return dist(bod, [ax + t*dx, ay + t*dy]);
}
const smerOri = (a,b,c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
const leziNa = (a,b,c) => Math.min(a[0],b[0]) <= c[0] && c[0] <= Math.max(a[0],b[0])
                       && Math.min(a[1],b[1]) <= c[1] && c[1] <= Math.max(a[1],b[1]);
function kriz(p,q){
  const d1 = smerOri(q[0],q[1],p[0]), d2 = smerOri(q[0],q[1],p[1]);
  const d3 = smerOri(p[0],p[1],q[0]), d4 = smerOri(p[0],p[1],q[1]);
  if(((d1>0) !== (d2>0)) && ((d3>0) !== (d4>0)) && d1 && d2 && d3 && d4) return true;
  return [[d1,q[0],q[1],p[0]],[d2,q[0],q[1],p[1]],[d3,p[0],p[1],q[0]],[d4,p[0],p[1],q[1]]]
    .some(([d,u,v,w]) => d === 0 && leziNa(u,v,w));
}
function useckyVzdalenost(p,q){
  if(kriz(p,q)) return 0;
  return Math.min(bodUsecka(p[0],q), bodUsecka(p[1],q), bodUsecka(q[0],p), bodUsecka(q[1],p));
}
function obrysyVzdalenost(p,q){
  if(p[0] === "kruh" && q[0] === "kruh"){
    const [sa,ra] = p[1], [sb,rb] = q[1];
    return Math.max(0, dist(sa,sb) - ra - rb);
  }
  if(p[0] === "kruh"){ const t = p; p = q; q = t; }
  if(q[0] === "kruh"){
    const [stred,r] = q[1];
    return Math.max(0, Math.min(...p[1].map(u => bodUsecka(stred,u))) - r);
  }
  let m = Infinity;
  for(const u of p[1]) for(const v of q[1]) m = Math.min(m, useckyVzdalenost(u,v));
  return m;
}
/* Kde se dva obrysy potkávají NEJBLÍŽ — dvojice bodů, mezi kterými platí
   `obrysyVzdalenost`. Číslo se počítalo správně už dřív, ale čára se kreslila
   z `pozice` do `pozice`, a `pozice` znamená u každého tvaru něco jiného:
   u zdi/dveří (`pozice_do`) je to JEDEN KONEC — klidně ten vzdálenější —,
   u úsečky z `rozmer`/`smer` je to STŘED. Výkres tak tvrdil něco jiného než
   popiska u něj. Měřítko je obrys, ať to čára ukazuje. */
function bodNaUsecce(bod, u){
  const [[ax,ay],[bx,by]] = u, dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy;
  if(l2 === 0) return u[0];
  const t = Math.max(0, Math.min(1, ((bod[0]-ax)*dx + (bod[1]-ay)*dy) / l2));
  return [ax + t*dx, ay + t*dy];
}
function prusecik(p,q){
  const [a,b] = p, [c,d] = q;
  const r = [b[0]-a[0], b[1]-a[1]], s = [d[0]-c[0], d[1]-c[1]];
  const den = r[0]*s[1] - r[1]*s[0];
  if(!den) return null;                       // rovnoběžné/splývající → níž
  const t = ((c[0]-a[0])*s[1] - (c[1]-a[1])*s[0]) / den;
  return [a[0] + t*r[0], a[1] + t*r[1]];
}
function dvojiceUsecek(u,v){
  if(kriz(u,v)){ const p = prusecik(u,v); if(p) return [p, p, 0]; }
  const kand = [[u[0], bodNaUsecce(u[0],v)], [u[1], bodNaUsecce(u[1],v)],
                [bodNaUsecce(v[0],u), v[0]], [bodNaUsecce(v[1],u), v[1]]];
  let nej = kand[0], nejd = Infinity;
  for(const par of kand){ const d = dist(par[0],par[1]); if(d < nejd){ nejd = d; nej = par; } }
  return [nej[0], nej[1], nejd];
}
function naKruhu(stred, r, k){                // bod kruhu nejbližší bodu `k`
  const d = dist(stred,k);
  if(!d) return stred;
  const m = Math.min(r, d);
  return [stred[0] + (k[0]-stred[0])/d*m, stred[1] + (k[1]-stred[1])/d*m];
}
function nejblizsiDvojice(p,q){
  if(p[0] === "kruh" && q[0] === "kruh"){
    const [sa,ra] = p[1], [sb,rb] = q[1];
    const x = naKruhu(sa,ra,sb), y = naKruhu(sb,rb,sa);
    if(dist(sa,sb) <= ra + rb){ const t = [(x[0]+y[0])/2, (x[1]+y[1])/2]; return [t,t]; }
    return [x,y];
  }
  if(p[0] === "kruh"){ const [x,y] = nejblizsiDvojice(q,p); return [y,x]; }
  if(q[0] === "kruh"){
    const [stred,r] = q[1];
    let nej = null, nejd = Infinity;
    for(const u of p[1]){ const b = bodNaUsecce(stred,u), d = dist(b,stred);
                          if(d < nejd){ nejd = d; nej = b; } }
    return [nej, naKruhu(stred, r, nej)];
  }
  let nej = null, nejd = Infinity;
  for(const u of p[1]) for(const v of q[1]){
    const [a,b,d] = dvojiceUsecek(u,v);
    if(d < nejd){ nejd = d; nej = [a,b]; }
  }
  return nej;
}

/* Dráha z `a` na `b`: začátek v KOTVĚ a (oči má bytost uprostřed, ne na kůži),
   konec na NEJBLIŽŠÍM BODĚ obrysu b (vidím na potok = vidím kterýkoli jeho kus).
   Nesymetrické záměrně — `a` se dívá, `b` je to, na co. Viz prostor._paprsek. */
function nejblizsiObrysu(tvar, bod){
  return nejblizsiDvojice(["usecky", [[bod, bod]]], tvar)[1];
}
function paprsek(a, b){
  const odkud = a.pozice, tel = obrys(b);
  if(!odkud || !tel) return null;
  return [odkud, nejblizsiObrysu(tel, odkud)];
}

function protinaObrys(a,b,cizi){
  if(cizi[0] === "kruh"){
    const [stred,r] = cizi[1];
    return r > 0 && bodUsecka(stred,[a,b]) <= r;
  }
  return cizi[1].some(u => (u[0][0] !== u[1][0] || u[0][1] !== u[1][1]) && useckyVzdalenost([a,b],u) <= 0);
}

/* -- svislá osa -------------------------------------------------------- */
const vyskaOf = o => (o.vyska === undefined || o.vyska === null) ? null : o.vyska;
const zOf = o => o.z || 0;
const vrchol = o => zOf(o) + (vyskaOf(o) === null ? STROP : vyskaOf(o));
const vyskaOci = o => zOf(o) + (vyskaOf(o) === null ? 0 : vyskaOf(o));
const svislyOdstup = (a,b) => Math.max(0, zOf(a) - vrchol(b), zOf(b) - vrchol(a));
const cloniVeVysce = (p, v) => zOf(p) <= v && v <= vrchol(p);
/* `hladina` říká „kdyby byl ve výšce h“ — hledání cesty se tím ptá po patrech,
   aniž by muselo bytostí hýbat. Bez ní platí, kde stojí (přepis
   `_prekazi_pohybu`, kde je týž nepovinný parametr). */
function prekaziPohybu(p, kdo, hladina){
  if(!kdo) return true;
  const z = (hladina === undefined || hladina === null) ? zOf(kdo) : hladina;
  const spodek = z + KROK_NAHORU;
  const vrsek = z + (vyskaOf(kdo) === null ? VYSKA_BYTOSTI : vyskaOf(kdo));
  return vrchol(p) > spodek && zOf(p) < vrsek;
}
const vyskaDrahy = (a,b,podil) => vyskaOci(a) + (vyskaOci(b) - vyskaOci(a)) * podil;
function podilKrizeni(a,b,cizi){
  const delka = dist(a,b);
  if(delka === 0) return 0;
  const body = cizi[0] === "kruh" ? [cizi[1][0]] : cizi[1].flat();
  let nej = body[0], nejd = Infinity;
  for(const p of body){ const d = bodUsecka(p,[a,b]); if(d < nejd){ nejd = d; nej = p; } }
  const s = [(b[0]-a[0])/delka, (b[1]-a[1])/delka];
  const t = (nej[0]-a[0])*s[0] + (nej[1]-a[1])*s[1];
  return Math.max(0, Math.min(1, t/delka));
}

function vzdalenost(a,b){
  const ua = obrys(a), ub = obrys(b);
  if(!ua || !ub) return null;
  const vodorovne = obrysyVzdalenost(ua,ub), svisle = svislyOdstup(a,b);
  return svisle ? Math.hypot(vodorovne, svisle) : vodorovne;
}

function brani(o, co){
  if(STAVY_ZRUSENE.some(s => maStav(o,s))) return false;
  if(o.brani) return o.brani.includes(co);
  for(const [tag,[v,p]] of Object.entries(PREKAZKY))
    if(maTag(o,tag) && (co === VYHLED ? v : p)) return true;
  return false;
}
/* Zorné pole: nejmenší úhel na KTERÝKOLI bod obrysu (přepis _uhel_k_obrysu). */
function uhelMezi(vrchol, a, b){
  const u = [a[0]-vrchol[0], a[1]-vrchol[1]], v = [b[0]-vrchol[0], b[1]-vrchol[1]];
  const nu = Math.hypot(...u), nv = Math.hypot(...v);
  if(!nu || !nv) return 0;
  const c = Math.max(-1, Math.min(1, (u[0]*v[0] + u[1]*v[1]) / (nu*nv)));
  return Math.acos(c);
}
function uhelKObrysu(odkud, kouka, tvar){
  if(tvar[0] === "kruh"){
    const [stred, r] = tvar[1], d = dist(odkud, stred);
    if(d <= r) return 0;
    return Math.max(0, uhelMezi(odkud, kouka, stred) - Math.asin(Math.min(1, r/d)));
  }
  const body = tvar[1].flat();
  const dosah = Math.max(0, ...body.map(b => dist(odkud, b))) + 1;
  if(dosah <= 1) return 0;
  const sm = [kouka[0]-odkud[0], kouka[1]-odkud[1]], n = Math.hypot(...sm) || 1;
  const pap = [odkud, [odkud[0]+sm[0]/n*dosah, odkud[1]+sm[1]/n*dosah]];
  let nej = Math.PI;
  for(const u of tvar[1]){
    if((u[0][0] !== u[1][0] || u[0][1] !== u[1][1]) && kriz(pap, u)) return 0;
    for(const b of u){
      if(b[0] === odkud[0] && b[1] === odkud[1]) return 0;
      nej = Math.min(nej, uhelMezi(odkud, kouka, b));
    }
  }
  return nej;
}
function zornePole(o){
  if(o.zorne_pole != null) return o.zorne_pole;
  return maTag(o, TAG_BYTOSTI) ? ZORNE_POLE_BYTOSTI : null;
}
function vZornemPoli(kdo, co){
  const vysec = zornePole(kdo);
  if(vysec == null || vysec >= 360) return true;
  const odkud = kdo.pozice, tel = obrys(co);
  if(!odkud || !tel) return true;
  const kouka = posun(odkud, otoc([1,0], kdo.smer || 0));
  return uhelKObrysu(odkud, kouka, tel) <= (vysec * Math.PI/180) / 2;
}
function vnima(kdo, co, objekty){
  return vZornemPoli(kdo, co) && prekazkyMezi(kdo, co, objekty, VYHLED).length === 0;
}

function prekazkyMezi(a, b, objekty, co){
  const p = paprsek(a, b);
  if(!p) return [];
  const [ua, ub] = p, stojici = [];
  for(const o of objekty){
    if(o === a || o === b || !brani(o,co)) continue;
    const cizi = obrys(o);
    if(!cizi || !protinaObrys(ua, ub, cizi)) continue;
    if(co === POHYB){ if(!prekaziPohybu(o,a)) continue; }
    else if(!cloniVeVysce(o, vyskaDrahy(a, b, podilKrizeni(ua, ub, cizi)))) continue;
    stojici.push(o);
  }
  return stojici;
}

/* -- hledání cesty a zóna pohybu (přepis `zona_pohybu` z prostor.py) ----
 *
 * Do 4. 8. 2026 se tohle do JS SCHVÁLNĚ nepřepisovalo a výkres kreslil zónu
 * zapečenou Pythonem. Mělo to jednu vadu, kvůli které se testovací místnosti
 * nedaly opravdu zkoušet: zóna platila pro rozestavení ZE SOUBORU, takže
 * jakmile se čarodějem hnulo, musela zmizet — a chození bylo přesně to, co si
 * v ní chtěl člověk vyzkoušet.
 *
 * Druhá pravda o cestě to ale není, protože se nehlídá sama: Python zónu dál
 * peče do `kontrola[…].zona` a odznak nahoře obojí porovnává při každém
 * načtení scény. Je to týž vztah, jaký má zbytek geometrie — JS počítá,
 * Python je měřítko, rozejití je vidět.
 *
 * Nepřepisuje se `trasa`: tu potřebuje jen přehrávání taktů, kde na pořadí
 * uzlů záleží a shodu by hlídat nešlo. Zóně stačí VZDÁLENOSTI, a ty jsou
 * jednoznačné bez ohledu na to, v jakém pořadí Dijkstra uzly bere. */
const ODSTUP = 0.35;              // jak daleko od rohu vést cestu (i numerická vůle)
const VENEC = 8;                  // kolik uzlů kolem objemné překážky
const KROKU_ZA_TAH = 3.0;         // co ujdeš, než se scéna posune o krok (§39)
const PRECHODY = ["žebřík", "schody", "pěšina", "rampa"];

const klicB = b => b[0] + "," + b[1];
const klicU = (b, h) => b[0] + "," + b[1] + "," + h;

function poSmeru(z, k, delka){
  const dx = k[0]-z[0], dy = k[1]-z[1], norma = Math.hypot(dx, dy);
  if(norma === 0 || delka <= 0) return k;
  return [z[0] + dx/norma*delka, z[1] + dy/norma*delka];
}
function kolmice(stred, kBodu, delka){
  let dx = kBodu[0]-stred[0], dy = kBodu[1]-stred[1], norma = Math.hypot(dx, dy);
  if(norma === 0){ dx = 1; dy = 0; norma = 1; }
  const kx = -dy/norma*delka/2, ky = dx/norma*delka/2;
  return [[kBodu[0]-kx, kBodu[1]-ky], [kBodu[0]+kx, kBodu[1]+ky]];
}

/* Body, přes které se dá překážka obejít — rohy odsunuté o ODSTUP ven. */
function uzlyKolem(prekazka){
  const tvar = obrys(prekazka);
  if(!tvar) return [];
  const ven = [];
  if(tvar[0] === "kruh"){
    const stred = tvar[1][0], r = tvar[1][1] + ODSTUP;
    for(let i = 0; i < VENEC; i++)
      ven.push([stred[0] + r*Math.cos(2*Math.PI*i/VENEC),
                stred[1] + r*Math.sin(2*Math.PI*i/VENEC)]);
    return ven;
  }
  for(const [a, b] of tvar[1]){
    if(a[0] === b[0] && a[1] === b[1]){
      for(let i = 0; i < 4; i++)
        ven.push([a[0] + ODSTUP*Math.cos(2*Math.PI*i/4),
                  a[1] + ODSTUP*Math.sin(2*Math.PI*i/4)]);
      continue;
    }
    ven.push(poSmeru(b, a, dist(a,b) + ODSTUP));
    ven.push(poSmeru(a, b, dist(a,b) + ODSTUP));
    for(const [konec, druhy] of [[a,b], [b,a]]) ven.push(...kolmice(druhy, konec, 2*ODSTUP));
  }
  return ven;
}

/* Leží uzel v překážce (nebo těsně na ní)? Takový se do grafu nepustí. */
function uvnitrPrekazky(bod, prekazka){
  const tvar = obrys(prekazka);
  if(!tvar) return false;
  if(tvar[0] === "kruh") return dist(bod, tvar[1][0]) < tvar[1][1] + ODSTUP/2;
  return Math.min(...tvar[1].map(u => bodUsecka(bod, u))) < ODSTUP/2;
}
function necoVCeste(a, b, prekazky){
  return prekazky.some(p => { const t = obrys(p); return !!t && protinaObrys(a, b, t); });
}
function prekazkyPohybu(vsichni, odkud, kam, hladina){
  return vsichni.filter(o => o !== odkud && o !== kam && brani(o, POHYB)
                          && prekaziPohybu(o, odkud, hladina));
}

/* Dá se na tomhle místě v téhle výšce vůbec stát? Na zemi vždycky, výš jedině
   tam, kde něco sahá právě pod nohy (přepis `stoji_se`). */
function stojiSe(bod, hladina, vsichni){
  if(hladina === 0) return true;
  for(const o of vsichni){
    if(Math.abs(vrchol(o) - hladina) > KROK_NAHORU) continue;
    const tvar = obrys(o);
    if(!tvar) continue;
    if(tvar[0] === "kruh"){ if(dist(bod, tvar[1][0]) <= tvar[1][1]) return true; }
    else if(Math.min(...tvar[1].map(u => bodUsecka(bod, u))) <= ODSTUP) return true;
  }
  return false;
}

/* Žebříky a pěšiny jako hrany mezi hladinami: [dole, h, nahoře, h, cena]. */
function prechodyMezi(vsichni, odkud, kam){
  const ven = [];
  for(const o of vsichni){
    if(o === odkud || o === kam || !PRECHODY.some(t => maTag(o, t))) continue;
    const dole = o.pozice;
    if(!dole) continue;
    const nahore = o.pozice_do || dole;
    const hDole = zOf(o);
    const hNahore = (o.z_do === undefined || o.z_do === null)
      ? (vyskaOf(o) === null ? zOf(o) : zOf(o) + vyskaOf(o)) : o.z_do;
    if(hDole === hNahore) continue;      // vodorovný chodník, ne stoupání
    ven.push([dole, hDole, nahore, hNahore,
              Math.hypot(dist(dole, nahore), Math.abs(hNahore - hDole))]);
  }
  return ven;
}

/* Viditelnostní graf PO PATRECH + hrany přechodů (přepis `_graf_pater`). */
function grafPater(vsichni, kdo, kam, hladiny, prechody, vlastni, nedotknutelne){
  const uzly = [], prekazkyH = {};
  for(const h of hladiny){
    const prekazky = prekazkyPohybu(vsichni, kdo, kam, h);
    prekazkyH[h] = prekazky;
    let body = (vlastni[h] || []).slice();
    for(const p of prekazky) body = body.concat(uzlyKolem(p));
    const konce = new Set();
    for(const [a, ha, b, hb] of prechody){
      if(ha === h){ body.push(a); konce.add(klicB(a)); }
      if(hb === h){ body.push(b); konce.add(klicB(b)); }
    }
    for(const u of body){
      if(nedotknutelne.has(klicB(u)) || konce.has(klicB(u))
         || (!prekazky.some(p => uvnitrPrekazky(u, p)) && stojiSe(u, h, vsichni)))
        uzly.push([u, h]);
    }
  }
  const kde = {};
  uzly.forEach((uzel, i) => { const k = klicU(uzel[0], uzel[1]); if(!(k in kde)) kde[k] = i; });
  const sousedi = uzly.map(() => []);
  for(let i = 0; i < uzly.length; i++){
    const [ua, ha] = uzly[i];
    for(let j = i+1; j < uzly.length; j++){
      const [ub, hb] = uzly[j];
      if(ha !== hb || necoVCeste(ua, ub, prekazkyH[ha])) continue;
      const d = dist(ua, ub);
      sousedi[i].push([j, d]); sousedi[j].push([i, d]);
    }
  }
  for(const [a, ha, b, hb, cena] of prechody){     // hrany mezi patry
    const i = kde[klicU(a, ha)], j = kde[klicU(b, hb)];
    if(i === undefined || j === undefined) continue;
    sousedi[i].push([j, cena]); sousedi[j].push([i, cena]);
  }
  return {uzly, sousedi, kde, prekazky: prekazkyH};
}

/* Dijkstra ze `z`, uříznutá `stropem`. Vrací jen vzdálenosti: zóna víc
   nepotřebuje a předchůdci by na pořadí uzlů záviseli (viz úvod). */
function vzdalenosti(sousedi, z, strop){
  const vzdal = new Map([[z, 0]]), hotovo = new Set();
  for(;;){
    let i = -1, d = Infinity;
    for(const [u, du] of vzdal) if(!hotovo.has(u) && du < d){ i = u; d = du; }
    if(i < 0) break;
    hotovo.add(i);
    for(const [j, cena] of sousedi[i]){
      const nova = d + cena;
      if(strop != null && nova > strop) continue;
      if(nova < (vzdal.has(j) ? vzdal.get(j) : Infinity)) vzdal.set(j, nova);
    }
  }
  return vzdal;
}

/* Kam se bytost dostane, než se scéna pohne — mřížka [[x,y,hladina], …].
   Vzorkovaná schválně: přesná hranice „kam ještě dojdu“ je geodetický kruh
   kolem překážek a ten se nakreslit nedá, kdežto rastr ano. */
function zonaPohybu(kdo, vsichni, dosah, hustota){
  const start = kdo.pozice;
  if(!start || dosah <= 0 || hustota <= 0) return [];
  const prechody = prechodyMezi(vsichni, kdo, null);
  const hladiny = [...new Set([zOf(kdo), ...prechody.map(p => p[1]),
                               ...prechody.map(p => p[3])])].sort((a,b) => a-b);
  const vlastni = {}; vlastni[zOf(kdo)] = [start];
  const {uzly, sousedi, kde, prekazky} = grafPater(
    vsichni, kdo, null, hladiny, prechody, vlastni, new Set([klicB(start)]));
  const zacatek = kde[klicU(start, zOf(kdo))];
  if(zacatek === undefined) return [];
  const vzdal = vzdalenosti(sousedi, zacatek, dosah);

  /* Od nejbližšího uzlu TÉHOŽ patra: první, který bod uvidí, ho i nejlevněji
     obslouží. Mezi patry se skáče jen přechodem, takže se patra nemíchají. */
  const odrazi = {};
  for(const h of hladiny) odrazi[h] = [];
  for(const [i, d] of vzdal) odrazi[uzly[i][1]].push([uzly[i][0], d]);
  for(const h of hladiny) odrazi[h].sort((a,b) => a[1] - b[1]);

  const body = [];
  for(let sx = Math.ceil((start[0]-dosah)/hustota); sx <= Math.floor((start[0]+dosah)/hustota); sx++)
  for(let sy = Math.ceil((start[1]-dosah)/hustota); sy <= Math.floor((start[1]+dosah)/hustota); sy++){
    const bod = [zaokrouhli6(sx*hustota), zaokrouhli6(sy*hustota)];
    if(dist(start, bod) > dosah) continue;      // vzdušnou čarou daleko => nikdy
    for(const h of hladiny){
      if(prekazky[h].some(p => uvnitrPrekazky(bod, p))) continue;
      if(!stojiSe(bod, h, vsichni)) continue;   // ve vzduchu se nestojí
      for(const [uzel, d] of odrazi[h]){
        if(d > dosah) break;                    // dál jsou uzly mimo dosah
        if(d + dist(uzel, bod) <= dosah && !necoVCeste(uzel, bod, prekazky[h])){
          body.push([bod[0], bod[1], h]);
          break;
        }
      }
    }
  }
  return body;
}
const zaokrouhli6 = x => Math.round(x*1e6)/1e6;

/* ===================================================================== *
 * STAV
 * ===================================================================== */
let klic = null, scena = null, vybrany = null, konecMod = false;
let krok = 0.5, kamera = {x:0, y:0, m:44};      // m = pixelů na krok
const plocha = document.getElementById("plocha"), ctx = plocha.getContext("2d");

/* Rozměry plátna se MĚŘÍ, nedovozují. Kdyby měření vyšlo nula (rám bez
   výšky, plátno ještě mimo layout), sáhne se po náhradě — prázdná obrazovka
   je horší než plán v nepřesném měřítku. */
let SIR = 360, VYS = 560, LEV = 0, HOR = 0;
function zmerPlochu(){
  const r = plocha.getBoundingClientRect();
  SIR = Math.round(r.width)  || plocha.clientWidth  || window.innerWidth  || 360;
  VYS = Math.round(r.height) || plocha.clientHeight || window.innerHeight || 560;
  LEV = r.left; HOR = r.top;          // dotyk chodí v souřadnicích okna
}

let zonaVidno = true;        // vrstva zóny pohybu (jen náhled, viz kresliZonu)
let hybanoScenou = false;    // po první úpravě zóna ze souboru přestává platit
/* ZÁMEK PROTI TAHU. Rozvržení se dělá tak, že se pár kusů posune a všechno
   ostatní má zůstat — jenže plán se posouvá TÝMŽ prstem, jakým se táhne
   objekt, takže klepnutí vedle hotové zdi ji nepozorovaně odsune. Proto je
   ZAMČENO VÝCHOZÍ: kdo chce kusem hýbat, řekne to. Sleduje se tedy výjimka
   (odemčené), ne zámek — co v množině není, je zamčené, a nový objekt ve
   scéně je tím zamčený taky, aniž by se na něj muselo pamatovat.
   Zámek zakazuje TAH, ne psaní: čísla v panelu se nikdy nepřepíšou omylem,
   kdežto prst ano. A je to stav VÝKRESU, ne scény — do JSONu se nedostane,
   protože engine na něj nikde nekouká a pole, které nikdo nečte, je podle
   pravidel projektu jen ozdoba. Klíč je `id`, takže po přenačtení scény padá. */
const odemcene = new Set();
const zamceny = o => !!o && !odemcene.has(o.id);
const objekty = () => scena ? scena.objekty : [];
const umistene = () => objekty().filter(o => o.pozice);

function nactiScenu(k){
  klic = k;
  scena = JSON.parse(JSON.stringify(MISTNOSTI[k]));
  vybrany = null; konecMod = false; hybanoScenou = false;
  odemcene.clear();
  zastavCas(false); takt = 0; popisCasu();   // takty patří scéně, ne obrazovce
  nactiPozadi(k);
  panelVidno(false);
  srovnejKameru();
  overProtiPythonu();
  seznamMimo();
  kresli();
}

/* PODKLAD. Ruční doplňování výšek je hádanka, dokud nevidíš, že tohle je
   police a tamto lustr — proto se pod půdorys dá obrázek mapy, když ho scéna
   má (importér ho ukládá do ui/pozadi/). Kreslí se POD mřížku a ztlumeně:
   je to opora pro oko, ne pravda o scéně. Pravda jsou obrysy nad ním, a když
   se rozejdou, vidíš to na první pohled — proto jde podklad vypnout. */
let pozadiObr = null, pozadiRozmer = null, pozadiVidno = true;

function nactiPozadi(k){
  pozadiObr = null; pozadiRozmer = null;
  const p = (DATA.pozadi || {})[k];
  if(!p) return;
  pozadiRozmer = p.rozmer;
  const o = new Image();
  // Kreslí se, až se obrázek dekóduje; do té doby je půdorys prostě bez něj.
  o.onload = () => { if(pozadiObr === o) kresli(); };
  o.src = p.obrazek;
  pozadiObr = o;
}

function kresliPozadi(){
  if(!pozadiVidno || !pozadiObr || !pozadiObr.complete || !pozadiRozmer) return;
  const [s, v] = pozadiRozmer;
  ctx.save();
  ctx.globalAlpha = .5;
  // Obrázek leží od (0,0) po (šířka, výška) — tak ho importér umístil.
  ctx.drawImage(pozadiObr, sx(0), sy(v), s * kamera.m, v * kamera.m);
  ctx.restore();
}

function srovnejKameru(){
  const b = umistene().flatMap(o => {
    const u = obrys(o);
    if(!u) return [];
    return u[0] === "kruh"
      ? [[u[1][0][0]-u[1][1], u[1][0][1]-u[1][1]], [u[1][0][0]+u[1][1], u[1][0][1]+u[1][1]]]
      : u[1].flat();
  });
  if(!b.length){ kamera = {x:0, y:0, m:44}; return; }
  const xs = b.map(p=>p[0]), ys = b.map(p=>p[1]);
  const x0 = Math.min(...xs)-1.5, x1 = Math.max(...xs)+1.5;
  const y0 = Math.min(...ys)-1.5, y1 = Math.max(...ys)+1.5;
  zmerPlochu();
  const w = SIR, h = VYS - 150;
  kamera.m = Math.max(14, Math.min(110, Math.min(w/(x1-x0), h/(y1-y0))));
  kamera.x = (x0+x1)/2; kamera.y = (y0+y1)/2;
}

/* svět → obrazovka. y roste nahoru (půdorys, ne obrazovkové souřadnice) */
const sx = x => SIR/2 + (x - kamera.x) * kamera.m;
const sy = y => VYS/2 - (y - kamera.y) * kamera.m;
const wx = px => kamera.x + (px - SIR/2) / kamera.m;
const wy = py => kamera.y - (py - VYS/2) / kamera.m;
const zaokrouhli = v => krok ? Math.round(v/krok)*krok : Math.round(v*100)/100;

/* ===================================================================== *
 * KRESLENÍ
 * ===================================================================== */
function kresli(){
  zmerPlochu();
  const w = SIR, h = VYS, dpr = window.devicePixelRatio || 1;
  if(plocha.width !== Math.round(w*dpr) || plocha.height !== Math.round(h*dpr)){
    plocha.width = Math.round(w*dpr); plocha.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#0b1a2b";
  ctx.fillRect(0,0,w,h);
  kresliPozadi();
  kresliMrizku(w,h);
  kresliZonu();
  if(vybrany && vybrany.pozice) kresliDosahy(vybrany);
  for(const o of umistene()) kresliObjekt(o, o === vybrany);
  if(vybrany && vybrany.pozice) kresliVztahy(vybrany);
}

function kresliMrizku(w,h){
  const x0 = Math.floor(wx(0)), x1 = Math.ceil(wx(w));
  const y0 = Math.floor(wy(h)), y1 = Math.ceil(wy(0));
  if((x1-x0) > 400 || (y1-y0) > 400) return;
  ctx.lineWidth = 1;
  for(let x = x0; x <= x1; x++){
    ctx.strokeStyle = x % 5 ? "rgba(150,200,230,.06)" : "rgba(150,200,230,.13)";
    ctx.beginPath(); ctx.moveTo(sx(x)+.5, 0); ctx.lineTo(sx(x)+.5, h); ctx.stroke();
  }
  for(let y = y0; y <= y1; y++){
    ctx.strokeStyle = y % 5 ? "rgba(150,200,230,.06)" : "rgba(150,200,230,.13)";
    ctx.beginPath(); ctx.moveTo(0, sy(y)+.5); ctx.lineTo(w, sy(y)+.5); ctx.stroke();
  }
}

/* Signatura výkresu: prahy, na kterých mechanika visí, kolem vybraného kusu.
   Právě tohle dělá neviditelnou vrstvu čitelnou — „proč nedosáhnu?“

   DOSAH PLATÍ OD OBRYSU, NE OD KOTVY. Kružnice kolem `pozice` byla u potoka
   přesně ta lež, kterou dělala kóta vedená do jeho středu: dotek 1,5 se měří
   `vzdalenost`í, a ta bere obrys. Správný tvar je proto obrys ODSAZENÝ
   o poloměr — rovnoběžky k úsečkám a oblouky v rozích.
   Vnitřek uzavřeného tvaru se řídí týmž pravidlem jako `vzdalenost`: měří se
   ke stěně, takže velkému jezírku leží pruh „na dosah“ i uvnitř hladiny.   */
function cestaObrysu(g, u){
  g.beginPath();
  if(u[0] === "kruh"){
    const [s,r] = u[1];
    g.arc(sx(s[0]), sy(s[1]), Math.max(.5, r*kamera.m), 0, 7);
    return;
  }
  for(const [a,b] of u[1]){ g.moveTo(sx(a[0]), sy(a[1])); g.lineTo(sx(b[0]), sy(b[1])); }
}

/* Odsazení se KRESLÍ MASKOU, nepočítá se. Tah šířky 2r s kulatými spoji JE
   přesně ta oblast („co je blíž než r“); o pixel užší tah z ní vygumuje
   vnitřek a zbude hranice. Ručně počítané rovnoběžky by se v konkávním rohu
   protly a udělaly smyčku — u pěti meandrů potoka pokaždé. Maska ten případ
   nemá, protože nikdy nepracuje s jednotlivými čarami.                     */
let _maska = null, _pruhy = null;
function pruhy(g){
  if(_pruhy) return _pruhy;
  const t = document.createElement("canvas"); t.width = t.height = 8;
  const d = t.getContext("2d");
  d.strokeStyle = "#fff"; d.lineWidth = 5;
  for(const k of [-8, 0, 8]){          // tři rovnoběžky, aby dlaždice navazovala
    d.beginPath(); d.moveTo(-1+k, 9); d.lineTo(9+k, -1); d.stroke();
  }
  return (_pruhy = g.createPattern(t, "repeat"));
}

/* Zóna pohybu — kam se vybraná bytost dostane, než se scéna pohne.
   POČÍTÁ SE ŽIVĚ, tady v prohlížeči (`zonaPohybu` výš). Dřív byla zapečená
   Pythonem, a proto musela zmizet, jakmile se scénou hnulo — jenže chození
   je přesně to, co si na půdorysu člověk chce vyzkoušet: posuň čaroděje za
   roh a koukni, kam odtud dojde. Že se přepis nerozešel s Pythonem, hlídá
   odznak nahoře; zapečená zóna zůstala jako jeho měřítko.
   Kreslí se zóna VYBRANÉ bytosti (jinak čaroděje, a není-li, první živé),
   protože zóna patří tomu, kdo jde: hlídka na plošině má pod nohama podlahu
   tam, kde má čaroděj dole skálu nad hlavou. Klikáním je ten rozdíl vidět.
   Výsledek se pamatuje, dokud se scénou nehne — na telefonu je to znát. */
let _zona = null, _zonaProc = "";

function zonaCiselniky(){
  const z = DATA.zona || {};
  return {hustota: z.hustota || 0.75, dosah: z.dosah || 4*KROKU_ZA_TAH};
}

function kdoJde(){
  const zivi = umistene().filter(o => maTag(o, TAG_BYTOSTI));
  if(vybrany && zivi.includes(vybrany)) return vybrany;
  return zivi.find(o => o.id === "ja") || zivi[0] || null;
}

function kresliZonu(){
  if(!zonaVidno) return;
  const kdo = kdoJde();
  if(!kdo) return;
  const {hustota, dosah} = zonaCiselniky();
  /* Otisk scény: dokud se nezmění, zóna platí. Bere JEN to, na čem zóna
     stojí — kdo jde, kde kdo stojí a co odkud kam brání —, aby se přepočet
     nespouštěl při každém posunu plánu nebo výběru. */
  const proc = kdo.id + "|" + klic + "|" + JSON.stringify(umistene().map(o =>
    [o.id, o.pozice, o.pozice_do, o.z, o.z_do, o.vyska, o.tvar, o.rozmer,
     o.smer, o.body, o.tagy, o.stavy, o.brani]));
  /* Za pohybu prstu se NEPŘEPOČÍTÁVÁ. Zóna je desítky milisekund práce a
     překreslit se má každý snímek tahu — na telefonu by se plán táhl trhaně.
     Do puštění prstu se tedy kreslí ta předchozí, ztlumeně, aby bylo poznat,
     že ještě neplatí; hotová naskočí, jakmile se čaroděj někam postaví. */
  if(proc !== _zonaProc && !tah){
    _zonaProc = proc;
    _zona = zonaPohybu(kdo, umistene(), dosah, hustota);
  }
  if(!_zona || !_zona.length) return;
  const a = Math.abs(sx(hustota) - sx(0));
  ctx.save();
  if(proc !== _zonaProc) ctx.globalAlpha = 0.4;   // stará zóna, ještě se nepřepočetla
  /* Vlastní hladina zeleně, cizí (kam se vyleze přechodem) jantarově a menším
     čtvercem — na plochém obrázku leží obě přes sebe a bez rozlišení by z toho
     byla jedna nepravdivá plocha. */
  for(const [x,y,h] of _zona){
    const doma = h === zOf(kdo);
    ctx.fillStyle = doma ? "rgba(120,220,170,.16)" : "rgba(240,190,90,.22)";
    const s = doma ? a : a*0.6;
    ctx.fillRect(sx(x)-s/2, sy(y)-s/2, s, s);
  }
  ctx.restore();
}

function kresliOdsazeny(u, rpx, barva){
  const dpr = window.devicePixelRatio || 1;
  const m = _maska || (_maska = document.createElement("canvas"));
  if(m.width !== plocha.width || m.height !== plocha.height){
    m.width = plocha.width; m.height = plocha.height;
  }
  const g = m.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0, 0, SIR, VYS);
  g.lineJoin = "round"; g.lineCap = "round"; g.strokeStyle = barva;
  g.lineWidth = 2*rpx + 1;  cestaObrysu(g, u); g.stroke();
  if(2*rpx > 2){
    g.globalCompositeOperation = "destination-out";
    g.lineWidth = 2*rpx - 1;  cestaObrysu(g, u); g.stroke();
    g.fillStyle = pruhy(g);   g.fillRect(0, 0, SIR, VYS);   // šikmé mezery = čárkovaně
    g.globalCompositeOperation = "source-over";
  }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(m, 0, 0); ctx.restore();
}

function kresliDosahy(o){
  const u = obrys(o);
  if(!u) return;
  const kruhy = [[DOTEK,"dotek 1,5"], [PRAH_SIRENI,"šíření 2,0"], [PRAH_RETEZENI,"řetězení 2,5"]];
  const vrch = u[0] === "kruh" ? sy(u[1][0][1]) - u[1][1]*kamera.m
                               : Math.min(...u[1].flat().map(b => sy(b[1])));
  const stred = u[0] === "kruh" ? sx(u[1][0][0])
                                : (Math.min(...u[1].flat().map(b => sx(b[0]))) +
                                   Math.max(...u[1].flat().map(b => sx(b[0])))) / 2;
  for(const [r,popis] of kruhy){
    kresliOdsazeny(u, r*kamera.m, "rgba(245,167,66,.28)");
    if(kamera.m > 22){
      ctx.save();
      ctx.fillStyle = "rgba(245,167,66,.5)"; ctx.font = "10px ui-monospace,monospace";
      ctx.textAlign = "center"; ctx.fillText(popis, stred, vrch - r*kamera.m - 4);
      ctx.restore();
    }
  }
  if(zornePole(o) != null) kresliZornePole(o);
}

function kresliZornePole(o){
  const c = [sx(o.pozice[0]), sy(o.pozice[1])];
  const pul = (zornePole(o)/2) * Math.PI/180, smer = -(o.smer||0) * Math.PI/180;
  const r = Math.max(DOTEK, PRAH_RETEZENI) * kamera.m * 1.7;
  const g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], r);
  g.addColorStop(0, "rgba(245,167,66,.20)"); g.addColorStop(1, "rgba(245,167,66,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(c[0], c[1]);
  ctx.arc(c[0], c[1], r, smer - pul, smer + pul); ctx.closePath(); ctx.fill();
}

/* Kam se bytost dívá. `smer` je MECHANIKA (zorné pole, §5.2), ne popisek —
   dokud nebyl vidět, dal se u strážného přehlédnout a slepý úhel překvapil.
   Kreslí se jako klín na obvodu těla: čitelný i na těle o půl kroku. */
function kresliSmer(o, stred, r, vybran){
  const c = [sx(stred[0]), sy(stred[1])];
  const uhel = -(o.smer || 0) * Math.PI/180;      // plátno má y dolů
  const pul = 0.42;                               // šířka klínu v radiánech
  ctx.save();
  ctx.setLineDash([]);
  // Plný klín = směr NĚCO dělá (bytost má zorné pole, tedy i slepý úhel).
  // Bledý = `smer` je zatím jen údaj; ať výkres neslibuje mechaniku, co není.
  // Klín je od teď vždycky plný: směr u bytosti rozhoduje pokaždé, i když
  // `zorne_pole` nikdo nevyplnil. Bledá varianta zmizela spolu s výjimkou.
  ctx.fillStyle = vybran ? "#f5a742" : "#9fd3e8";
  ctx.beginPath();
  ctx.moveTo(c[0] + Math.cos(uhel)*r*1.95, c[1] + Math.sin(uhel)*r*1.95);
  ctx.lineTo(c[0] + Math.cos(uhel-pul)*r*0.9, c[1] + Math.sin(uhel-pul)*r*0.9);
  ctx.lineTo(c[0] + Math.cos(uhel+pul)*r*0.9, c[1] + Math.sin(uhel+pul)*r*0.9);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function kresliObjekt(o, vybran){
  const u = obrys(o);
  if(!u) return;
  const bv = brani(o, VYHLED), bp = brani(o, POHYB);
  ctx.save();
  ctx.lineWidth = vybran ? 3 : (bv || bp ? 2.5 : 1.5);
  ctx.strokeStyle = "#9fd3e8";
  if(vybran) ctx.strokeStyle = "#f5a742";
  else if(bv && !bp) ctx.strokeStyle = "#c9a5f0";           // clona, dá se projít
  else if(!bv && bp) ctx.setLineDash([7,4]);                // vidíš skrz, neprojdeš
  else if(!bv && !bp) ctx.strokeStyle = "rgba(159,211,232,.55)";

  if(u[0] === "kruh"){
    const [s,r] = u[1];
    ctx.beginPath(); ctx.arc(sx(s[0]), sy(s[1]), Math.max(2, r*kamera.m), 0, 7); ctx.stroke();
    if(maTag(o, TAG_BYTOSTI)) kresliSmer(o, s, Math.max(2, r*kamera.m), vybran);
  } else {
    const puntik = u[1].length === 1 && u[1][0][0][0] === u[1][0][1][0] && u[1][0][0][1] === u[1][0][1][1];
    if(puntik){
      ctx.beginPath(); ctx.arc(sx(o.pozice[0]), sy(o.pozice[1]), vybran ? 7 : 5, 0, 7);
      ctx.fillStyle = vybran ? "#f5a742" : "rgba(159,211,232,.85)"; ctx.fill();
    } else {
      ctx.beginPath();
      for(const [a,b] of u[1]){ ctx.moveTo(sx(a[0]), sy(a[1])); ctx.lineTo(sx(b[0]), sy(b[1])); }
      ctx.stroke();
    }
  }
  ctx.restore();

  /* popiska: jméno + svislá osa, je-li čím se lišit */
  const c = [sx(o.pozice[0]), sy(o.pozice[1])];
  ctx.fillStyle = vybran ? "#f5a742" : "#8fb0c4";
  ctx.font = (vybran ? "600 " : "") + "12px system-ui,sans-serif";
  ctx.textAlign = "center";
  ctx.fillText((zamceny(o) ? "" : "🔓 ") + (o.nazev || o.id), c[0], c[1] - 11);
  const svisle = [];
  if(zOf(o)) svisle.push("z " + fmt(zOf(o)));
  if(vyskaOf(o) !== null) svisle.push("v " + fmt(vyskaOf(o)));
  if(svisle.length){
    ctx.font = "10px ui-monospace,monospace"; ctx.fillStyle = "rgba(143,176,196,.75)";
    ctx.fillText(svisle.join("  "), c[0], c[1] + 20);
  }
}

/* Čáry k ostatním: vzdálenost a obě překážkové osy zvlášť. */
function kresliVztahy(o){
  const vsechny = umistene();
  for(const b of vsechny){
    if(b === o) continue;
    const d = vzdalenost(o,b);
    if(d === null) continue;
    const clony = prekazkyMezi(o, b, vsechny, VYHLED);
    const zdi = prekazkyMezi(o, b, vsechny, POHYB);
    const [pa, pb] = nejblizsiDvojice(obrys(o), obrys(b));
    const a1 = [sx(pa[0]), sy(pa[1])], a2 = [sx(pb[0]), sy(pb[1])];
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = clony.length || zdi.length ? "rgba(224,112,95,.55)" : "rgba(245,167,66,.22)";
    if(clony.length || zdi.length) ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = ctx.strokeStyle;   // dotyk na obrysu
    for(const t of [a1, a2]){ ctx.beginPath(); ctx.arc(t[0], t[1], 2, 0, 7); ctx.fill(); }
    ctx.restore();
    const m = [(a1[0]+a2[0])/2, (a1[1]+a2[1])/2];
    ctx.font = "10px ui-monospace,monospace"; ctx.textAlign = "center";
    let popis = fmt(d);
    if(clony.length) popis += " ⊘vid";
    if(zdi.length) popis += " ⊘chůze";
    ctx.fillStyle = clony.length || zdi.length ? "#e0705f" : "rgba(211,230,240,.6)";
    ctx.fillText(popis, m[0], m[1] - 3);
  }
}

const fmt = v => (Math.round(v*100)/100).toString().replace(".", ",");

/* ===================================================================== *
 * KONTROLA PROTI PYTHONU
 * ===================================================================== */
/* Porovná JS s kontrolními daty: nejdřív ZKOUŠKY (zeď, mříž, závěs, hradba,
   obrubník, troska, přepis `brani`) — ty pokrývají clonění a svislou osu,
   které v samotných scénách zatím nemá co spustit — a pak aktuální scénu. */
function srovnej(objekty, k){
  let nej = 0, chyb = 0, n = 0;
  const vs = objekty.filter(o => o.pozice);
  for(let i = 0; i < vs.length; i++) for(let j = i+1; j < vs.length; j++){
    const a = vs[i], b = vs[j];
    const par = a.id < b.id ? a.id+"|"+b.id : b.id+"|"+a.id;
    if(!(par in k.vzdalenost)) continue;
    n++;
    const py = k.vzdalenost[par], js = vzdalenost(a,b);
    if(py === null || js === null){ if(py !== js) chyb++; continue; }
    nej = Math.max(nej, Math.abs(py - js));
    if(Math.abs(py - js) > 1e-9) chyb++;
    const kde = k.kde && k.kde[par];                  // kóta končí tam co v Pythonu?
    if(kde){
      const mu = nejblizsiDvojice(obrys(a), obrys(b));
      const [x,y] = a.id < b.id ? mu : [mu[1], mu[0]];
      const odchylka = Math.max(dist(x, kde[0]), dist(y, kde[1]));
      nej = Math.max(nej, odchylka);
      if(odchylka > 1e-9) chyb++;
    }
    if(vnima(a,b,vs) !== k.vidi[par]) chyb++;
    if(prekazkyMezi(a,b,vs,POHYB).length === 0 !== k.projde[par]) chyb++;
  }
  return {n, chyb, nej};
}

/* Zóna: JS ji počítá živě (`zonaPohybu`), Python ji peče — a tady se to
   porovná. Bez tohohle by byl přepis hledání cesty jediným kusem geometrie,
   který nikdo nehlídá, a to je přesně ta druhá pravda, kvůli které se sem
   Dijkstra dlouho nepřepisoval. Sada bodů se srovnává celá, ne jen počet:
   stejně velká a jinak položená zóna je pořád špatná zóna. */
function srovnejZonu(objekty, k){
  let n = 0, chyb = 0;
  const z = k.zona;
  if(!z || !z.kdo) return {n, chyb};
  const vs = objekty.filter(o => o.pozice);
  for(const [id, zaznam] of Object.entries(z.kdo)){
    const kdo = vs.find(o => o.id === id);
    if(!kdo) continue;
    n++;
    const mam = zonaPohybu(kdo, vs, z.dosah, z.hustota);
    const otisk = b => b.map(x => Math.round(x*1e3)/1e3).join();
    const py = new Set(zaznam.body.map(otisk));
    const js = new Set(mam.map(otisk));
    if(py.size !== js.size || [...js].some(b => !py.has(b))) chyb++;
  }
  return {n, chyb};
}

function overProtiPythonu(){
  const odznak = document.getElementById("shoda");
  let n = 0, chyb = 0, nej = 0;
  for(const z of Object.values(DATA.zkousky || {})){
    const r = srovnej(z.objekty, z);
    n += r.n; chyb += r.chyb; nej = Math.max(nej, r.nej);
    const zn = srovnejZonu(z.objekty, z);
    n += zn.n; chyb += zn.chyb;
  }
  /* NEporovnává se rozeditovaná scéna, ale její PŮVODNÍ podoba ze souboru —
     jinak by odznak zčervenal, jakmile s něčím pohneš, a měřil by tvoje
     úpravy místo shody obou implementací. */
  if(DATA.kontrola[klic]){
    const r = srovnej(DATA.sceny[klic].objekty, DATA.kontrola[klic]);
    n += r.n; chyb += r.chyb; nej = Math.max(nej, r.nej);
    const zn = srovnejZonu(DATA.sceny[klic].objekty, DATA.kontrola[klic]);
    n += zn.n; chyb += zn.chyb;
  }
  odznak.className = chyb === 0 ? "ok" : "zle";
  odznak.textContent = chyb === 0
    ? "= python (" + n + ")"
    : "≠ python: " + chyb + " / Δ" + nej.toExponential(1);
}

const hod = (id,v) => { document.getElementById(id).value = v === "" ? "" : Math.round(v*1000)/1000; };
const cti = id => { const v = document.getElementById(id).value.trim(); return v === "" ? null : parseFloat(v.replace(",",".")); };

/* `body` se zadávají textem: na telefonu je psaní dvojic pořád snazší než
   klepat vrcholy do plátna a přitom se trefit vedle přetahování objektu. */
const vrcholyVidno = tvar => {
  document.getElementById("radek-body").style.display =
    (tvar === "lomena" || tvar === "polygon") ? "" : "none";
};
function ctiBody(){
  const text = document.getElementById("p-body").value.trim();
  if(!text) return [];
  const vrcholy = [];
  for(const kus of text.split(";")){
    if(!kus.trim()) continue;
    const c = kus.split(",").map(x => parseFloat(x.trim()));
    if(c.length !== 2 || c.some(isNaN)) return null;       // rozepsaný vstup
    vrcholy.push(c);
  }
  return vrcholy;
}

function zPanelu(){
  if(!vybrany) return;
  const o = vybrany;
  const x = cti("p-x"), y = cti("p-y");
  if(x !== null && y !== null && !isNaN(x) && !isNaN(y)){ o.pozice = [x,y]; hybanoScenou = true; } 
  const z = cti("p-z"); o.z = (z === null || isNaN(z)) ? 0 : z;
  if(!o.z) delete o.z;
  const v = cti("p-v");
  if(v === null || isNaN(v)) delete o.vyska; else o.vyska = v;
  const t = document.getElementById("p-tvar").value;
  if(t === "bod") delete o.tvar; else o.tvar = t;
  vrcholyVidno(t);
  if(t === "lomena" || t === "polygon"){
    const vrcholy = ctiBody();
    // `null` = uživatel je uprostřed psaní; nechat staré, ať tvar nemizí
    if(vrcholy !== null){ if(vrcholy.length >= 2) o.body = vrcholy; else delete o.body; }
  } else delete o.body;
  const d = cti("p-d") || 0, s = cti("p-s") || 0;
  if(d || s) o.rozmer = [d,s]; else delete o.rozmer;
  const sm = cti("p-smer");
  if(sm) o.smer = sm; else delete o.smer;
  const zp = cti("p-zp");
  if(zp === null || isNaN(zp)) delete o.zorne_pole; else o.zorne_pole = zp;
  kresli();
}

/* ===================================================================== *
 * DOTYK A MYŠ
 * ===================================================================== */
let tah = null, prsty = new Map(), rozpetiPred = 0;

/* Co je pod prstem. Kruh vrací NULOVOU vzdálenost všude uvnitř, takže skála
   (r=4) měla d=0 na celé své ploše a přebíjela hlídku, plošinu i zábradlí,
   které na ní stojí — vybrat je nešlo vůbec. Samotná vzdálenost tedy nestačí;
   mezi vším, co je pod prstem, rozhoduje popořadě:
     1. VÝŠKA — kdo stojí na něčem, je blíž oku (hlídka nad skálou),
     2. VELIKOST — míří se na ten menší kus (hlídka nad plošinou),
     3. vzdálenost — teprve když si jsou obojím rovni.
   Důsledek, který je vidět: uvnitř plošiny se skála vybrat nedá, mimo ni ano. */
function objektNaBode(px, py){
  const p = [wx(px), wy(py)], toler = 14 / kamera.m;
  const trefy = [];
  for(const o of umistene()){
    const u = obrys(o);
    if(!u) continue;
    let d, velikost;
    if(u[0] === "kruh"){
      d = Math.max(0, dist(p, u[1][0]) - u[1][1]);
      velikost = u[1][1];
    } else {
      d = Math.min(...u[1].map(s => bodUsecka(p, s)));
      velikost = Math.max(0, ...u[1].map(s => dist(s[0], s[1])));
    }
    if(d < toler) trefy.push({o, d, velikost, z: o.z || 0});
  }
  // Vzdálenost rozhoduje jen HRUBĚ: co je zřetelně blíž prstu, vyhraje i tak
  // (jinak by při oddálení kradla hlídka kliknutí z metrů daleko). Teprve mezi
  // těmi, na které se míří stejně, rozhoduje výška a velikost.
  const skupina = t => Math.round(t.d / (toler / 3));
  trefy.sort((a,b) => (skupina(a) - skupina(b)) || (b.z - a.z)
                      || (a.velikost - b.velikost) || (a.d - b.d));
  return trefy.length ? trefy[0].o : null;
}

plocha.addEventListener("pointerdown", e => {
  plocha.setPointerCapture(e.pointerId);
  prsty.set(e.pointerId, [e.clientX, e.clientY]);
  if(prsty.size === 2){ tah = null; rozpetiPred = rozpeti(); return; }
  const o = objektNaBode(e.clientX - LEV, e.clientY - HOR);
  // Sáhnutí na kus zastaví čas a vrátí takt 0 — jedno pravidlo místo výjimek
  // pro tah, panel a export. Posouvat plán a koukat se přitom smíš dál:
  // kamera o scéně nic netvrdí.
  if(o !== null && hodiny) zastavCas(true);
  if(o !== null && o !== vybrany) vyber(o);   // vybrat se dá i zamčený kus
  const typ = tahPodPrstem(o, konecMod);
  tah = typ === "posun"
    // `cisty` říká, že se prstem jen posouvalo a nic se netrefilo — na konci
    // takového tahu padá výběr. Nad zamčeným kusem tedy čistý není: právě
    // jsme ho vybrali a odemykat se má čím.
    ? {typ, px: e.clientX, py: e.clientY, x: kamera.x, y: kamera.y, cisty: o === null}
    : {typ, o, px: e.clientX, py: e.clientY};
});

/* Co udělá prst: táhne objektem, táhne jeho druhým koncem, nebo posouvá plán.
   Jedno místo schválně — zámek se nesmí dát obejít druhou cestou —, a navíc
   pojmenovaná funkce jde vyzkoušet, kdežto obsluha události ne (viz
   tests/vyber_pudorys.mjs; klikání dřív nehlídal nikdo a prošla tudy chyba). */
function tahPodPrstem(o, konec){
  if(o === null || zamceny(o)) return "posun";
  return konec ? "konec" : "objekt";
}

function rozpeti(){
  const [a,b] = [...prsty.values()];
  return Math.hypot(a[0]-b[0], a[1]-b[1]);
}

plocha.addEventListener("pointermove", e => {
  if(!prsty.has(e.pointerId)) return;
  prsty.set(e.pointerId, [e.clientX, e.clientY]);
  if(prsty.size === 2){
    const r = rozpeti();
    if(rozpetiPred > 0) kamera.m = Math.max(6, Math.min(200, kamera.m * r / rozpetiPred));
    rozpetiPred = r; kresli(); return;
  }
  if(!tah) return;
  if(tah.typ === "posun"){
    if(Math.abs(e.clientX - tah.px) + Math.abs(e.clientY - tah.py) > 4) tah.cisty = false;
    kamera.x = tah.x - (e.clientX - tah.px) / kamera.m;
    kamera.y = tah.y + (e.clientY - tah.py) / kamera.m;
    kresli(); return;
  }
  const b = [zaokrouhli(wx(e.clientX - LEV)), zaokrouhli(wy(e.clientY - HOR))];
  if(tah.typ === "konec") tah.o.pozice_do = b; else tah.o.pozice = b;
  hybanoScenou = true;
  if(tah.o === vybrany) vyber(tah.o);
  kresli();
});

function konecTahu(e){
  if(tah && tah.typ === "posun" && tah.cisty && vybrany) vyber(null);
  prsty.delete(e.pointerId);
  if(prsty.size < 2) rozpetiPred = 0;
  tah = null;
}
plocha.addEventListener("pointerup", konecTahu);
plocha.addEventListener("pointercancel", konecTahu);
plocha.addEventListener("wheel", e => {
  e.preventDefault();
  kamera.m = Math.max(6, Math.min(200, kamera.m * (e.deltaY < 0 ? 1.12 : 0.89)));
  kresli();
}, {passive:false});
window.addEventListener("resize", () => { srovnejKameru(); kresli(); });
if(window.ResizeObserver) new ResizeObserver(() => {
  const r = plocha.getBoundingClientRect();
  if(Math.round(r.width) !== SIR || Math.round(r.height) !== VYS){ srovnejKameru(); kresli(); }
}).observe(plocha);
window.addEventListener("load", () => { srovnejKameru(); kresli(); });

/* ===================================================================== *

/* Dvě skupiny, ať je na první pohled poznat, co je svět a co pískoviště. */
const volba = document.getElementById("volba");
for(const [popis, jsou] of [["scény", false], ["zkušební místnosti", true]]){
  const skupina = document.createElement("optgroup");
  skupina.label = popis;
  for(const k of Object.keys(MISTNOSTI)){
    if(jeZkouska(k) !== jsou) continue;
    const m = MISTNOSTI[k], opt = document.createElement("option");
    opt.value = k;
    opt.textContent = m.nazev + "  (" + m.objekty.filter(o => o.pozice).length

}
volba.onchange = () => nactiScenu(volba.value);

/* ===================================================================== *
 * ČAS — přehrávání zapečených taktů chození (§9)
 *
 * Výkres čas NEPOČÍTÁ. Kudy hlídka jde, rozhoduje hledání cesty, a to se do
 * JS nepřepisuje (druhá pravda o cestě, viz kresliZonu) — proto se přehrává
 * hotová odpověď, kterou spočítal skutečný engine v `generuj_pudorys.py`.
 * Důsledek, který je vidět: takty platí pro rozestavení ZE SOUBORU. Jakmile
 * se výkresem hne, čas se zastaví a vrátí na nulu — nakreslená hlídka vedle
 * přesunuté zdi by lhala, stejně jako by lhala zóna.
 *
 * Takt 0 JE rozestavení ze souboru, takže „zastavit“ = vrátit se na nulu.
 * Žádný záložní stav se tím nemusí držet a JSON vyjde takový, jaký přišel.
 * ===================================================================== */
/* Takt trvá pořád stejně, ať se v něm ušly tři kroky, nebo se jen stálo:
   tah je tah a stejně dlouho trvá i čekání. Rychlost chůze se tedy ladí jedině
   tímhle číslem — při třech krocích za takt vyjde 1000 ms na svižnou chůzi. */
const KROK_CASU = 1000;                  // ms na takt
const casTlac = document.getElementById("cas-prep");
const chuzeSceny = () => (DATA.kontrola[klic] || {}).chuze || null;
let takt = 0, hodiny = null;

/* Místo na lomené čáře v daném PODÍLU její délky — bod a k němu SMĚR úseku,
   po kterém se zrovna jde. Snímky jsou po taktech a takt je až tři kroky, takže
   bez tohohle se bytost mezi dvěma snímky teleportuje. Vede se po skutečné
   dráze (`v[4]`), ne po přímce mezi konci: kdo v jednom taktu obchází roh,
   obchází ho i na výkrese; přímka by ho v rohu protáhla zdí.

   `smer` je `null`, když se nikam nejde (stání) nebo když úsek vede jen nahoru
   — u svislého kusu není „kam", a atan2(0,0) by ukázalo na východ. */
function mistoNaDraze(draha, podil){
  const useky = [], smery = [];
  let celkem = 0;
  for(let i = 1; i < draha.length; i++){
    const dx = draha[i][0] - draha[i-1][0], dy = draha[i][1] - draha[i-1][1],
          dz = (draha[i][2] || 0) - (draha[i-1][2] || 0);
    const d = Math.hypot(dx, dy, dz);
    useky.push(d); celkem += d;
    smery.push(Math.hypot(dx, dy) < 1e-9 ? null
               : ((Math.atan2(dy, dx) * 180 / Math.PI) % 360 + 360) % 360);
  }
  const konec = draha[draha.length - 1];
  if(!celkem) return {bod: konec, smer: null};
  let zbyva = Math.max(0, Math.min(1, podil)) * celkem;
  for(let i = 0; i < useky.length; i++){
    if(zbyva > useky[i]){ zbyva -= useky[i]; continue; }
    const t = useky[i] ? zbyva / useky[i] : 1;
    const a = draha[i], b = draha[i+1];
    return {bod: [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t,
                  (a[2]||0) + ((b[2]||0)-(a[2]||0))*t],
            smer: smery[i]};
  }
  return {bod: konec, smer: smery[smery.length - 1]};
}

function bodNaDraze(draha, podil){ return mistoNaDraze(draha, podil).bod; }

/* Úhel mezi dvěma směry KRATŠÍM obloukem. Hlídka na krajním bodě dojde čelem
   k cestě a pak se otočí po místnosti (na balvan, na ohniště), což je otočka
   o osmdesát až devadesát stupňů — a skokem to vypadalo jako cuknutí. Přes
   nulu se točí správně: z 350 na 10 jde deset stupňů doprava, ne tři sta
   čtyřicet doleva. */
function uhelMezi(od, kam, podil){
  const rozdil = ((((kam - od) % 360) + 540) % 360) - 180;
  return (((od + rozdil * podil) % 360) + 360) % 360;
}

/* Podíl taktu, ve kterém se bytost stočí do směru chůze. Vyjít z kroku
   otočená jinam, než kam jde, vypadá jako klouzání; stočit se skokem zase jako
   cuknutí. Čtvrtina taktu je krátká na to, aby se to četlo jako „vyrazila". */
const PODIL_OTOCKY = 0.25;

/* Jeden takt. PŘI CHŮZI se bytost dívá tam, kam jde — směr si tedy bere z dráhy,
   ne z konce taktu. Kdo stojí, ten se rozhlíží, a to je KROK CHOVÁNÍ, ne
   animace: `otoc_se` je zdarma, tah spotřebuje `cekej`, takže dvojice
   „otoč se — počkej" je jedno rozhlédnutí za takt a výkres ho jen plynule
   proloží. Mezi dvěma takty žádný stav není; tohle je obrázek, ne pravda. */
function prejezd(cil){
  const ch = chuzeSceny();
  if(!ch){ zastavCas(false); return; }      // scéna bez chodců: není co jezdit
  const draha = {}, smery = {};
  for(const o of objekty()){
    const v = ch.takty[cil][o.id];
    if(!v || !o.pozice) continue;
    draha[o.id] = [[o.pozice[0], o.pozice[1], o.z || 0],
                   ...(v[4] || []), [v[0], v[1], v[2] || 0]];
    smery[o.id] = [o.smer || 0, v[3] || 0];
  }
  const zacatek = performance.now();
  const snimek = () => {
    if(!hodiny) return;                       // mezitím se zastavilo
    const podil = (performance.now() - zacatek) / KROK_CASU;
    if(podil >= 1){
      nastavTakt(cil);
      hodiny = requestAnimationFrame(() => prejezd((cil + 1) % ch.takty.length));
      return;
    }
    for(const o of objekty()){
      const d = draha[o.id];
      if(!d) continue;
      const m = mistoNaDraze(d, podil);
      o.pozice = [m.bod[0], m.bod[1]];
      if(m.bod[2]) o.z = m.bod[2]; else delete o.z;
      o.smer = m.smer === null
        ? uhelMezi(smery[o.id][0], smery[o.id][1], podil)          // rozhlíží se
        : uhelMezi(smery[o.id][0], m.smer, Math.min(1, podil / PODIL_OTOCKY));
    }
    kresli();
    hodiny = requestAnimationFrame(snimek);
  };
  hodiny = requestAnimationFrame(snimek);
}

function nastavTakt(i){
  const ch = chuzeSceny();
  if(!ch) return;
  const kolik = ch.takty.length;
  takt = ((i % kolik) + kolik) % kolik;
  /* NULA se nebere ze snímku, ale ze samotné scény — ta je jediná pravda o tom,
     jak přišla ze souboru, VČETNĚ toho, které údaje v ní vůbec nejsou. Snímek
     nese čísla, a číslem zapsaná nula se od chybějícího údaje v exportu pozná:
     `"smer":0.0` by z g1 zmizelo. To by byla tichá změna scény za koukání na
     ni, tedy přesně to, čemu má vracení na nulu zabránit. Snímek 0 se proto
     hodí jen hlídači (test_pudorys.py ho srovnává se souborem), ne přehrávači. */
  const zdroj = DATA.sceny[klic].objekty;
  for(const o of objekty()){
    if(!ch.kdo.includes(o.id)) continue;
    if(takt === 0){
      const p = zdroj.find(z => z.id === o.id) || {};
      for(const pole of ["pozice", "z", "smer"]){
        if(pole in p) o[pole] = JSON.parse(JSON.stringify(p[pole]));
        else delete o[pole];
      }
      continue;
    }
    const v = ch.takty[takt][o.id];
    if(!v) continue;
    o.pozice = [v[0], v[1]];
    // Nula se maže, ne zapisuje — táž úmluva, jakou drží panel (`zPanelu`).
    if(v[2]) o.z = v[2]; else delete o.z;
    if(v[3]) o.smer = v[3]; else delete o.smer;
  }
  popisCasu();
  kresli();
}

function popisCasu(){
  const ch = chuzeSceny();
  casTlac.style.opacity = ch ? "" : ".45";
  casTlac.textContent = !ch ? "▶ čas"
    : hodiny ? "⏸ " + takt + "/" + (ch.takty.length - 1)
    : (takt ? "▶ " + takt : "▶ čas");
}

function zastavCas(naNulu){
  if(hodiny){ cancelAnimationFrame(hodiny); hodiny = null; }
  // Vrací se VŽDY, i když `takt` je nula: zastavit se dá i uprostřed přejezdu
  // z nultého taktu, a to je stav mezi snímky — scéna by v něm zůstala stát
  // a vyexportovala by se s hlídkou půl kroku vedle.
  if(naNulu) nastavTakt(0);
  popisCasu();
}

casTlac.onclick = () => {
  const ch = chuzeSceny();
  if(!ch){
    havarie("Scéna „" + (scena ? scena.nazev : "?") + "“ nemá bytost s chováním "
          + "(`chovani` v datech scény), takže není co přehrávat.");
    return;
  }
  if(hybanoScenou){
    havarie("Zapečené takty platí pro rozestavení ze souboru, a tím už je "
          + "hnuto. Přepni scénu (data se načtou znovu), nebo přegeneruj výkres "
          + "(`python generuj_pudorys.py`).");
    return;
  }
  if(hodiny){ zastavCas(true); return; }
  vyber(null);                     // při běhu se needituje; panel by si odporoval
  hodiny = true;                   // příznak „běží"; `prejezd` si ho hned přepíše
  prejezd((takt + 1) % ch.takty.length);
  popisCasu();
};

document.getElementById("mrizka-prep").onclick = e => {
  krok = krok === 0.5 ? 0.1 : (krok === 0.1 ? 0 : 0.5);
  e.target.textContent = krok ? krok.toString().replace(".", ",") : "volně";
};

document.getElementById("vystup").onclick = () => {
  zastavCas(true);          // JSON se vydává z taktu 0, ne z půlky obchůzky
  document.getElementById("vypis-text").value = JSON.stringify(scena, null, 2);
  document.getElementById("vypis").style.display = "flex";
};
document.getElementById("v-zpet").onclick = () => { document.getElementById("vypis").style.display = "none"; };
document.getElementById("v-kopie").onclick = async e => {
  const t = document.getElementById("vypis-text");
  try { await navigator.clipboard.writeText(t.value); e.target.textContent = "Zkopírováno"; }
  catch { t.select(); document.execCommand("copy"); e.target.textContent = "Zkopírováno"; }
  setTimeout(() => { e.target.textContent = "Kopírovat"; }, 1400);
};

/* start: první místnost, která má rozmístěno. Přes MÍSTNOSTI, ne přes scény:
   veřejná zkušebna se generuje BEZ scén (nese jen zkoušky, aby se s ní
   nezveřejnila řešení) a spadla by hned na prvním řádku. */
const prvni = Object.keys(MISTNOSTI).find(k => MISTNOSTI[k].objekty.some(o => o.pozice))
           || Object.keys(MISTNOSTI)[0];
volba.value = prvni;
try {
  nactiScenu(prvni);
  if(!umistene().length) havarie("Scéna „" + scena.nazev + "“ nemá rozmístěný "
    + "žádný objekt. Vyber jinou nahoře, nebo objekty přidej tlačítky dole.");
  const r = plocha.getBoundingClientRect();
  if(!Math.round(r.width) || !Math.round(r.height))
    havarie("Plátno nemá rozměr: " + Math.round(r.width) + "×" + Math.round(r.height)
      + "  (okno " + window.innerWidth + "×" + window.innerHeight + ")."
      + "  Kreslím náhradně " + SIR + "×" + VYS + ".");
} catch(e){ havarie("Výkres se nenačetl: " + (e && e.stack || e)); }
</script>
