name: testy

# Testy JS enginu. Běží při každém pushi a PR do main a hlídají, že přepis
# z Pythonu sedí na oracle: geometrie (`fixtury_geometrie.json`) i skloňování
# (`fixtury_jazyk.json`), obojí vydané z vsc-magie. `test/vse.mjs` je spouští
# všechny (glob), takže další portovaný kus se přidá sám. NEZASAHUJE do
# `zkusebna.yml` — ten jen přenáší web z enginu; tenhle ověřuje kód.
#
# Fixtury jsou zatím VENDOROVANÉ (spočítá je Python oracle v vsc-magie a
# nakopírují se sem). Když se v enginu změní geometrie nebo skloňování,
# přegeneruj oracle a fixtury; jinak zeleň tady znamená „JS sedí na STARÝ
# oracle". Až JS pokryje celý engine, Python se zruší a oracle zmizí — do té
# doby je to ta pravda.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS engine == Python oracle
        run: node test/vse.mjs
