name: zkušebna

# Zkušebna se VYRÁBÍ v soukromém enginu vsc-magie (z pudorys.html, bez scén),
# kde ji po zelených testech CI věší jako artefakt. Sem se jen PŘENÁŠÍ.
#
# Spouští se SIGNÁLEM z enginu (`repository_dispatch`), ne `workflow_run`:
# ten totiž reaguje jen na workflow ve VLASTNÍM repu, napříč repy mlčí (a
# přesně na to jsme narazili — nula běhů). Engine tedy po zelených testech
# „ťukne" sem úzkým tokenem a tenhle workflow na ťuknutí zareaguje. Ručně jde
# spustit taky.

on:
  repository_dispatch:
    types: [zkusebna-hotova]
  workflow_dispatch:

permissions:
  contents: write          # commit zkušebny zpět do repa

jobs:
  prenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEJNOVĚJŠÍ HOTOVÝ ARTEFAKT, ne z konkrétního běhu. Číslo běhu ze signálu
      # nejde použít: engine artefakt nahraje a HNED nato pošle signál, takže
      # ten běh v tu chvíli ještě běží — a stáhnout artefakt z neukončeného
      # běhu API neumí. Bereme proto poslední dokončený „zkusebna" jménem;
      # zpoždění o jeden běh nevadí, geometrie se nemění každou minutu.
      #
      # `dawidd6/action-download-artifact` tohle umí (najde napříč běhy podle
      # jména), kdežto oficiální `download-artifact` chce `run-id`.
      - name: Stáhnout zkušebnu z vsc-magie
        uses: dawidd6/action-download-artifact@v9
        with:
          name: zkusebna
          repo: AdrTru/vsc-magie
          workflow: testy.yml
          workflow_conclusion: success
          github_token: ${{ secrets.TOKEN_ZKUSEBNA }}
          path: staz
          if_no_artifact_found: fail

      # index.html je to, co Pages servírují jako kořen. Přepíše se jen když se
      # obsah opravdu změnil — jinak by tu přibývaly prázdné commity po každém
      # pushi do enginu, i když se geometrie nehnula.
      - name: Uložit jako index.html, když se změnil
        run: |
          set -e
          # dawidd6 rozbaluje do path/<název_artefaktu>/, oficiální by dal do
          # path/. Vezmeme soubor, ať leží kdekoli z toho.
          SRC=$(find staz -name zkusebna.html | head -1)
          if [ -z "$SRC" ] || [ ! -s "$SRC" ]; then
            echo "Artefakt je prázdný nebo chybí — nic neukládám."; exit 1
          fi
          if cmp -s "$SRC" index.html; then
            echo "Zkušebna se nezměnila, commit netřeba."; exit 0
          fi
          mv "$SRC" index.html
          git config user.name "zkušebna-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Zkušebna obnovena z vsc-magie"
          git push
          echo "✅ index.html obnoven a publikován" >> $GITHUB_STEP_SUMMARY
