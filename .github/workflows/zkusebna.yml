name: zkušebna

# Zkušebna se VYRÁBÍ v soukromém enginu vsc-magie (z pudorys.html, bez scén),
# kde ji po zelených testech CI věší jako artefakt. Sem se jen PŘENÁŠÍ.
#
# Spouští se SIGNÁLEM z enginu (`repository_dispatch`), ne `workflow_run`:
# ten totiž reaguje jen na workflow ve VLASTNÍM repu, napříč repy mlčí (a
# přesně na to jsme narazili — nula běhů). Engine tedy po zelených testech
# „ťukne" sem úzkým tokenem a tenhle workflow na ťuknutí zareaguje. Ručně jde
# spustit taky.

on:
  repository_dispatch:
    types: [zkusebna-hotova]
  workflow_dispatch:

permissions:
  contents: write          # commit zkušebny zpět do repa

jobs:
  prenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NEJNOVĚJŠÍ HOTOVÝ ARTEFAKT, ne z konkrétního běhu. Číslo běhu ze signálu
      # nejde použít: engine artefakt nahraje a HNED nato pošle signál, takže
      # ten běh v tu chvíli ještě běží — a stáhnout artefakt z neukončeného
      # běhu API neumí. Bereme proto poslední dokončený „zkusebna" jménem;
      # zpoždění o jeden běh nevadí, geometrie se nemění každou minutu.
      #
      # `dawidd6/action-download-artifact` tohle umí (najde napříč běhy podle
      # jména), kdežto oficiální `download-artifact` chce `run-id`.
      - name: Stáhnout zkušebnu z vsc-magie
        uses: dawidd6/action-download-artifact@v9
        with:
          name: zkusebna
          repo: AdrTru/vsc-magie
          workflow: testy.yml
          workflow_conclusion: success
          github_token: ${{ secrets.TOKEN_ZKUSEBNA }}
          path: staz
          if_no_artifact_found: fail

      # KOPÍRUJE SE CELÝ ARTEFAKT, ne jmenovitě zkušebna. Co jde ven, rozhoduje
      # `publikace.py` v enginu — tady by druhý seznam zestárl v okamžiku, kdy
      # tam přibude stránka, a nikdo by si toho nevšiml: běh by prošel zeleně
      # a soubor by na webu prostě nebyl. Jediné, co si tenhle repozitář drží
      # sám, je že `zkusebna.html` je kořen Pages, tedy `index.html`.
      #
      # Commit se dělá jen při skutečné změně — jinak by tu přibývaly prázdné
      # commity po každém pushi do enginu, i když se nic nehnulo.
      - name: Uložit artefakt do repa, když se změnil
        run: |
          set -e
          # dawidd6 rozbaluje do path/<název_artefaktu>/, oficiální by dal do
          # path/. Najdeme složku, ať leží kdekoli z toho.
          SRC=$(dirname "$(find staz -name zkusebna.html | head -1)")
          if [ ! -s "$SRC/zkusebna.html" ]; then
            echo "Artefakt je prázdný nebo chybí — nic neukládám."; exit 1
          fi
          cp "$SRC/zkusebna.html" index.html
          rm "$SRC/zkusebna.html"
          # Zbytek artefaktu jde do kořene pod svým jménem (rozvrzeni.html,
          # panely.js, …). Prázdný artefakt sem nespadne — kontrola je výš.
          find "$SRC" -maxdepth 1 -type f -exec cp {} . \;
          git config user.name "zkušebna-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nic se nezměnilo, commit netřeba."; exit 0
          fi
          git commit -m "Web obnoven z vsc-magie"
          git push
          echo "✅ web obnoven a publikován" >> $GITHUB_STEP_SUMMARY
