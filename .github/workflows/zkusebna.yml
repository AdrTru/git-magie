name: zkušebna

# Zkušebna se VYRÁBÍ v soukromém enginu vsc-magie (z pudorys.html, bez scén),
# kde ji po zelených testech CI věší jako artefakt. Sem se jen PŘENÁŠÍ.
#
# Spouští se SIGNÁLEM z enginu (`repository_dispatch`), ne `workflow_run`:
# ten totiž reaguje jen na workflow ve VLASTNÍM repu, napříč repy mlčí (a
# přesně na to jsme narazili — nula běhů). Engine tedy po zelených testech
# „ťukne" sem úzkým tokenem a tenhle workflow na ťuknutí zareaguje. Ručně jde
# spustit taky.

on:
  repository_dispatch:
    types: [zkusebna-hotova]
  workflow_dispatch:

permissions:
  contents: write          # commit zkušebny zpět do repa

jobs:
  prenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Číslo běhu posílá engine v signálu (`repository_dispatch` má payload
      # jen do 64 kB, takže soubor sám se jím poslat nedá — jen odkaz na něj).
      # Token musí umět ČÍST i soukromé vsc-magie, aby artefakt stáhl.
      - name: Stáhnout zkušebnu z vsc-magie
        uses: actions/download-artifact@v4
        with:
          name: zkusebna
          repository: AdrTru/vsc-magie
          run-id: ${{ github.event.client_payload.run_id }}
          github-token: ${{ secrets.TOKEN_ZKUSEBNA }}
          path: staz

      # index.html je to, co Pages servírují jako kořen. Přepíše se jen když se
      # obsah opravdu změnil — jinak by tu přibývaly prázdné commity po každém
      # pushi do enginu, i když se geometrie nehnula.
      - name: Uložit jako index.html, když se změnil
        run: |
          set -e
          if [ ! -s staz/zkusebna.html ]; then
            echo "Artefakt je prázdný nebo chybí — nic neukládám."; exit 1
          fi
          if cmp -s staz/zkusebna.html index.html; then
            echo "Zkušebna se nezměnila, commit netřeba."; exit 0
          fi
          mv staz/zkusebna.html index.html
          git config user.name "zkušebna-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Zkušebna obnovena z vsc-magie (běh ${{ github.event.client_payload.run_id }})"
          git push
          echo "✅ index.html obnoven a publikován" >> $GITHUB_STEP_SUMMARY
